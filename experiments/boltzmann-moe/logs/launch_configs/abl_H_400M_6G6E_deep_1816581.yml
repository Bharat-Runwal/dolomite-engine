# ABLATION H -- DEEP, NO RECURRENCE: 6 GPT + 6 DISTINCT energy blocks, each applied once.
# Separates distinct depth from recurrent depth at matched TOTAL parameters.
# I_total = 28,096 per block (K=32, I_e=878) -> total 399.855M (+0.018% vs the 400M hybrid).
# Active 238.022M, FLOPwt 238.022M -- with no recurrence FLOPwt EQUALS active.
# WARNING -- this arm spends 20.5% FEWER parameter-applications per token than the 400M hybrid
# (238.0M vs 299.4M) and 26% fewer than abl_G. Iso-TOTAL does not mean iso-FLOP across these
# structures; compare within a pair (H vs H-baseline), never H against G.
# sinkhorn_mu_iters = 1 = this block's layer_iterations entry (pre-flight rule 9).
# *** INTENDED GPU COUNT: 8 ***  mbs 2 x ga 8 x 4096 x 8 = 524,288 tok/step; 61,035 steps = 32.0B
