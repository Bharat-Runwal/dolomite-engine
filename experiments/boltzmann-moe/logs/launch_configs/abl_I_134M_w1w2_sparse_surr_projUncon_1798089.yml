# ABLATION I -- is psd_anti costing us? Same arm as cmix_134M_hyb_w1w2_sparse_surr_32B with the
# descent projection changed from `psd_anti` to `unconstrained`, and NOTHING else.
#
# energy_proj_type valid values in THIS tree: unconstrained | pos_scalar | identity | psd_anti
# (energy/layer.py:883). NOTE the CommonConfig DEFAULT is already "unconstrained"; psd_anti is the
# opt-in. Do not confuse this with `proj_mode: unconstrained`, which appears in a colleague's config
# and does NOT exist here -- that spelling is a silent no-op (see the DATAMIX REFERENCE block in
# CLAUDE.md).
#
# PARAMETER EFFECT IS NEGLIGIBLE, so this is an iso-param A/B. psd_anti costs d*r + d*d with the
# CommonConfig default energy_proj_rank: 32 -> 768*32 + 768*768 = 614,400. unconstrained costs d*d
# = 589,824. Difference -24,576 params = -0.018% of the 134M total.
#
# DECISION IS AT THE 8B MILESTONE (step 30,517), by windowed-median train-lm_loss over steps
# 29,500-31,500 -- 201 logged points, so the median's standard error is ~0.001 while the per-step
# IQR is ~0.021. References measured that way on the same window:
#     w1w2 sparse(surrogate), psd_anti  2.8883   <- the arm this is an A/B against
#     hopfield sparse(proxy) hybrid     2.8948
#     GPT-only dense (abl_D)            2.8749
# So a proj effect worth acting on has to move lm_loss by more than ~0.003 to be resolvable, and
# more than ~0.013 to matter against the GPT-only arm.
#
# *** INTENDED GPU COUNT: 4 ***  mbs 4 x ga 4 x 4096 x 4 = 262,144 tok/step; 122,070 steps = 32.0B
# (full schedule kept so the arm is valid if continued past the 8B decision point).
datasets:
- class_name: MegatronDataset
  data_name: Megatron
  data_sampling_ratio: 1
  class_args:
    eval_steps: 2
    data_cache_path: /proj/dmfexp/nima/.cache/megatron_cmix
    data_path:
    - 0.35
    - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
    - 0.35
    - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
    - 0.15
    - /proj/datasets/granite-4-datasets-megatron-merged/megamath-web-pro_0
    - 0.15
    - /proj/datasets/granite-4-datasets-megatron-merged/finemath-3plus-rewritten_0
    split: 99,0.5,0.5
    sequence_length: 4096
tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken
model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: energy
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations:
    - 1
    - 1
    - 1
    - 1
    - 1
    - 1
    - 6
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 768
    num_layers: 7
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: unconstrained
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
    - &id001
      sequence_mixer_type: softmax_attention
      num_attention_heads: 12
      num_key_value_heads: 12
      add_bias: false
      attention_multiplier: 0.125
    - *id001
    - *id001
    - *id001
    - *id001
    - *id001
    - sequence_mixer_type: energy_attention
      num_attention_heads: 12
      num_key_value_heads: 12
      add_bias: false
      attention_multiplier: 0.125
    mlp_blocks:
    - &id002
      mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 2048
      add_bias: false
    - *id002
    - *id002
    - *id002
    - *id002
    - *id002
    - mlp_type: EnergyFF_SurrogateBoltzmannMoE
      expert_kind: w1w2
      intermediate_size: 8192
      n_experts: 16
      top_k: 2
      hopfield_grad_scale: sqrt_consistent
      routing_norm: zscore
      temperature: 1.0
      repulsion_form: abs
      repulsion_coef: 0.1
      n_repulsion_pairs: 4
      gelu_grad_method: sigmoid
      e_sign_override: neg
      sinkhorn_iters: 3
      repulsion_tensor_idx: true
      activation_function: gelu
      add_bias: false
      # ---- TRUE SPARSITY (the only difference from cmix_134M_hyb_w1w2_surrMLP_32B) ----
      # sparse_forward needs fused_experts (asserted in energy_ff.py), and for expert_kind:
      # w1w2 the pair (w1w2, fused_experts) is what get_mlp_block dispatches on to reach
      # energy_ff_w1w2_sparse.BoltzmannMoEW1W2Sparse. Registered 2026-09-19; before that this
      # combination could not be built at all.
      sparse_forward: true
      fused_experts: true
      # p = 4 candidates nominated by the HEAD; the EXACT bilinear energies of those 4 (free --
      # a by-product of their forward projection) re-rank to the final top_k = 2 and set every
      # weight. The head is a SELECTOR, never a gate.
      sparse_candidates: 4
      # +2 uniformly-random experts during TRAINING. Without exploration the candidate-
      # restricted KL only ever sees experts the head already nominated, so it is
      # self-reinforcing and cannot discover an expert it wrongly ranked out.
      sparse_explore: 2
      # DENSE PHASE FIRST, and it is not optional: a selector cannot learn the ranking inside
      # the sparse path (its target is only the p-candidate set -- measured: agreement sat at
      # 0.47-0.53 against a 0.50 chance floor for 240 steps, while dense took it 0.12 -> 0.79
      # in 280). Steps 1..299 run the dense fused path, which distils the head against the
      # exact all-K routing distribution; step 300 on is sparse.
      sparse_start_step: 300
      # renormalize_topk: true keeps the softmax denominator on the k winners. With false, the
      # denominator would be COMPLETED from the head over the 12 experts it never evaluated --
      # measured wikitext bits/byte 1.1161 -> 3.4346 -- and lm_loss would train the head
      # directly, fighting the KL.
      renormalize_topk: true
      # ---- the head is now the cheap all-K ROUTER, not an eval-time gate ---------------- #
      # surrogate_replaces_proxy overrides _proxy_energies, which is the ONE seam by which the
      # head reaches _forward_sparse (that path never calls _route). Mutually exclusive with
      # use_surrogate, which would hand the head's pseudo-energies to _route and make it set
      # the mixture WEIGHTS -- the Switch-style gate this design exists not to be.
      surrogate_replaces_proxy: true
      use_surrogate: false
      # proxy_loss_coef is what TRAINS the head in BOTH phases under this mode. At 0 the head
      # stays at its random init and selection is arbitrary.
      proxy_loss_coef: 0.01
      # pre_mu: distil pre-mu against pre-mu, the convention _forward_sparse already uses. With
      # "legacy" the head is re-targeted at the dense->sparse handover and the Sinkhorn dual
      # (measured 3.44 logit units, an ~31x tilt) is counted twice on the dense selection path.
      proxy_mu_convention: pre_mu
      # surrogate_coef 0: REDUNDANT here. In the dense phase _proxy_step already applies the
      # same pre-mu all-K KL to the same head; in the sparse phase surrogate_coef is a no-op
      # because _forward_sparse never calls _route. The two would simply add.
      surrogate_coef: 0.0
      # proxy_rank 0: the rank-r subspace proxy is NOT the selector here. The mixin forces it to
      # 1 (the frozen base asserts proxy_rank > 0 for sparse_forward) and then releases the
      # tensors from model.parameters(), so they cost nothing and are absent from the
      # state_dict. For w1w2 specifically the subspace proxy is the wrong tool anyway: its
      # m-row subsample has relative error ~sqrt(I_e/m) because the bilinear energy's terms
      # cancel, so it is forced to m = I_e, where it costs MORE per token than the sparse
      # mixture it exists to make cheap. The head's cost has no I_e in it at all.
      proxy_rank: 0
      # STRUCTURALLY REQUIRED even though the rank-r proxy is unread here: the pydantic default
      # is "quad" and BoltzmannMoEW1W2Sparse implements only "subspace"/"bilinear" (a diagonal
      # quadratic in the r coefficients cannot represent a bilinear energy), so it asserts on
      # "quad" at construction -- before the mixin gets to free the tensors.
      proxy_kind: subspace
      repulsion_space: output
      # REQUIRED with sparse_forward + repulsion_space: output -- the sparse path never
      # computes all K expert outputs, so repulsion is evaluated on 64 tokens instead.
      repulsion_subsample: 64
      sinkhorn_persist_mu: true
      surrogate_kind: mlp
      surrogate_detach_input: true
      surrogate_track_agree: true
      sinkhorn_mu_iters: 6
      surrogate_hidden: 256
tuning_args:
  tuning_method: pretraining
save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/boltzmann-moe/results/iclr26_abl/abl_I_134M_w1w2_sparse_surr_projUncon
  save_interval: 2000
  max_to_keep: 2
logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: energy-inference-large
    name: abl_I_134M_w1w2_sparse_surr_projUncon
training_parameters:
  num_training_steps: 122070
  eval_interval: 5000
  micro_batch_size: 4
  gradient_accumulation_steps: 4
  eval_during_training: false
  gradient_clipping: 1
optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 2e-3
    weight_decay: 0.1
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000
  num_constant_steps: 0
  num_decay_steps: 120070
mixed_precision_args:
  dtype: bf16
distributed_args:
  fsdp_algorithm: 2
  torch_compile: true
  stage: 0
