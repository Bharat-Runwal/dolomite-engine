    - sequence_mixer_type: softmax_attention
      num_attention_heads: 16
      num_key_value_heads: 16
      add_bias: false
      attention_multiplier: 0.125
    - sequence_mixer_type: softmax_attention
      num_attention_heads: 16
      num_key_value_heads: 16
      add_bias: false
      attention_multiplier: 0.125
    mlp_blocks:
    - mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 2320
      add_bias: false
    - mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 2320
      add_bias: false
    - mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 2320
      add_bias: false
    - mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 2320
      add_bias: false
    - mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 2320
