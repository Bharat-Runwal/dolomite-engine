# ABLATION F -- GPT-only dense at ISO-ACTIVE, the control abl_D could not be.
# 6 dense GPT layers, no MoE, no energy block, no recurrence. I = 2320.
# abl_D was iso-TOTAL and therefore carried +9% ACTIVE params than the routed arms (134.3M vs
# 123.2M) while spending FEWER parameter-applications per token -- two advantages pulling in
# opposite directions, so its +0.73pp over the hybrid was not a single-variable result.
# This arm is iso-ACTIVE: total = active = 123.308M against the 134M hybrid's 123.243M ACTIVE
# (+0.053%). Since it is dense, total = active = FLOPwt, so it is simultaneously iso-active AND
# iso-FLOP-weight with the hybrid's ACTIVE -- but note the hybrid's FLOPwt is 141.7M because its
# block is applied 6x, so this arm still spends 13% fewer parameter-applications per token.
# *** INTENDED GPU COUNT: 4 ***  mbs 4 x ga 4 x 4096 x 4 = 262,144 tok/step; 122,070 steps = 32.0B
datasets:
- class_name: MegatronDataset
  data_name: Megatron
  data_sampling_ratio: 1
  class_args:
    eval_steps: 2
    data_cache_path: /proj/dmfexp/nima/.cache/megatron_cmix
    data_path:
    - 0.35
    - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
    - 0.35
    - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
    - 0.15
