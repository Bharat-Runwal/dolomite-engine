# Watchdog config — boltz-MoE training jobs that should auto-resubmit on failure.
# Format (pipe-separated): name|config|queue|group|gpus|exclusive|walltime|mem|max_resubmits
#
# - name           : LSF job name (also the prefix for bsub log filenames)
# - config         : path to dolomite-engine YAML
# - queue          : LSF queue
# - group          : LSF -G group
# - gpus           : N (eg 8)
# - exclusive      : 1 to add /task:mode=exclusive_process and -x flag, 0 for shared
# - walltime       : HH:MM
# - mem            : LSF memory string (e.g. 64G)
# - max_resubmits  : how many times the watchdog will resubmit before giving up
#
# Lines starting with # are ignored. Blank lines are ignored.

# 580M training (priority — main result for the talk).
egpt_h1_boltz_moe_580m|/proj/dmfexp/nima/Code/dolomite-engine/configs/boltzmann_moe/h1_boltz_moe_580m_8x4096_d1536.yml|normal|grp_ebm|8|1|24:00|64G|10

