# CORRECTED-SIGN + SINKHORN RERUN of iclr_flops/iclr_hop_K16_dense (2026-09-15).
#
# The paper will report the CORRECTED model, so every EnergyFF_BoltzmannMoE arm in the
# grid is rerun with the routing sign fixed and balance supplied by the exact dual.
# Changes from the original, and ONLY these:
#   e_sign_override: "pos"     the original ANTI-ROUTES (selects the worst-matching
#                              experts, 0.62x average overlap) -- ROUTING_SIGN_BUG_20260915.md
#   temperature: 1.0           0.35 was calibrated UNDER the inverted sign; 1.0 is what
#                              the tau x balance sweep selected (T5) and 134M M3 validated
#   sinkhorn_iters: 3          exact chemical-potential balancing, no clamp, no gain
#   repulsion_tensor_idx: true REQUIRED: repulsion's Python-random index lists cost 3
#                              dynamo graph breaks and ~17 recompiles per 8 calls, and
#                              stalled a 2-node job for 13 min. Tensor indices: 1 graph,
#                              0 breaks. NOT optional on a long run.
#   save_interval: 1000        REQUIRED on preemptable: at 5000 an arm can be preempted
#                              before ever reaching a checkpoint and make ZERO net
#                              progress (observed on two pure-GPT baselines, 28 and 27
#                              submissions with nothing to show).
# NOT changed: architecture, tokens, steps, LR schedule, seed -- so these are directly
# comparable to the originals at matched steps.
#
# NOTE cos_probe is deliberately absent: `_cos_probe_fires` calls Tensor.item(), an
# unconditional graph break. Diagnostics only; use it on single-node probes.
# iclr_hop_K16_dense
#
# energy router, hopfield, K=16, DENSE soft — quality upper bound
#
# FLOPS-frontier wave (2026-09-12). Backbone FIXED across ALL arms:
#   d=768, 7 blocks, layer_iterations [1,1,1,1,1,1,6], 12 heads, GPT ffn 2048,
#   30000 steps = 7.86B tokens, lr 2e-3 cosine. ONLY the MoE block differs.
# Iso-total-params in the MoE block (12.58M): w1w2 and the learned-router
#   class use 2*I_tot*d, hopfield uses I_tot*d, so hopfield carries 2x the
#   experts for the same parameters -> half the k/K at equal top_k.
# Question: quality vs k/K frontier against a learned-router MoE at each K.
#
# h1_boltz_moe_fullsize: direct BoltzmannMoE equivalent of h1_topk_egpt_moe
# Architecture identical to h1_topk; only the EGPT FFN routing differs:
#   h1_topk:            TopK_Energy_MoE_MLP  (sparse, learned linear router, load-balance loss)
#   h1_boltz_fullsize:  BoltzmannMoE_Energy_MLP (soft Boltzmann routing, energy-based router)
#
# KEY FIX vs h1_boltz_egpt_moe (existing): full-size experts, NOT iso-param.
#   OLD (iso-param): intermediate_size=2048 total → 4×512 per expert (tiny, same fail as B-series)
#   NEW (full-size): intermediate_size=8192 total → 4×2048 per expert (matches h1_topk capacity)
#
# This isolates routing mechanism (Boltzmann vs TopK) from expert capacity.
# Paired with repulsion λ=0.1 (best from B4) to discourage load collapse.
#
# Layers 1-6: softmax_attention + standard MLP (int=2048) — GPT prefix
# Layer 7:    energy_attention  + BoltzmannMoE_Energy_MLP (×6 recurrent)
#               4 experts × 2048 per expert = 8192 total intermediate
#
# Param count: ~145M (same order as h1_topk ~145M)

datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path: /proj/dmfexp/nima/.cache/megatron
      data_path:
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
      split: 99.5,0.5,0
      sequence_length: 4096

tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken

model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: energy
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations: [1, 1, 1, 1, 1, 1, 6]
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 768
    num_layers: 7
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: dual_unconstrained
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
      - &gpt_attn {sequence_mixer_type: softmax_attention, num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - sequence_mixer_type: energy_attention
        num_attention_heads: 12
        num_key_value_heads: 12
        add_bias: false
        attention_multiplier: 0.125
    mlp_blocks:
      - &gpt_ffn {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      # Full-size BoltzmannMoE: 4 experts × 2048 each = 8192 total (matches h1_topk capacity)
      - mlp_type: EnergyFF_BoltzmannMoE
        expert_kind: hopfield
        intermediate_size: 16384   # total across K; I_e = 1024
        n_experts: 16
        hopfield_grad_scale: sqrt_consistent   # 2026-09-12 fix; REVERT = mean
        routing_norm: zscore
        temperature: 1.0
        repulsion_form: abs
        repulsion_coef: 0.1
        n_repulsion_pairs: 4
        gelu_grad_method: sigmoid
        # ---- corrected variant ----
        e_sign_override: "pos"
        sinkhorn_iters: 3
        repulsion_tensor_idx: true
        activation_function: gelu
        add_bias: false

tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/boltzmann-moe/results/iclr_sink/iclr_hop_K16_dense_sink
  save_interval: 1000
  max_to_keep: 2

logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: energy-inference-large
    name: iclr_hop_K16_dense_sink

training_parameters:
  num_training_steps: 30000
  eval_interval: 5000
  micro_batch_size: 4
  gradient_accumulation_steps: 4
  eval_during_training: false
  gradient_clipping: 1

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 2e-3
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-8

lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000
  num_constant_steps: 0
  num_decay_steps: 28000

mixed_precision_args:
  dtype: bf16

distributed_args:
  fsdp_algorithm: 2
  torch_compile: true
  stage: 0

# 2026-09-15: AUTO-RESUME, added mid-run. Without this an arm restarts from step 0 whenever
# LSF REQUEUES it. LSF preemption here goes SSUSP -> PEND -> RUN on the SAME job id, which
# re-executes the original bsub command with this original config; the watchdog's
# auto-resume never runs because the watchdog never resubmitted. Measured damage before the
# fix: iclr_hop_K16_dense_sink lost ~19000 steps, slope90k_hyb_sink ~18500, across 4 starts
# each. save_interval alone does NOT protect against this -- the checkpoints were on disk
# the whole time and simply never loaded.
load_args:
  load_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/boltzmann-moe/results/iclr_sink/iclr_hop_K16_dense_sink
