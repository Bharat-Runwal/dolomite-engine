# V51: Fine-tune EGPT 6×2 (Procrustes merge from V1 12×1) — cosine lr=2e-3→2e-4, 10k steps.
# Same setup as V47 but 2× longer training. Motivation: V47 (5k steps) loss=3.464 was still
# dropping at the end, suggesting more steps would improve further.
# V49 (const lr=2e-3, 5k steps) got 3.650 — confirming LR decay is necessary.

datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path: /proj/dmfexp/nima/.cache/megatron
      data_path:
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
      split: 99.5,0.5,0
      sequence_length: 4096

tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken

model_args:
  model_class: AutoModelForCausalLM
  model_name: /proj/dmfexp/nima/Code/dolomite-engine/experiments/energy-inference/results/multi-block-ablation/v45_merged_procrustes_6x2_init

tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/energy-inference/results/multi-block-ablation/v51_egpt_6x2_procrustes_merge_finetune_lr2e3_10k_d768
  save_interval: 2000

logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: energy-inference-large
    name: v51_egpt_6x2_procrustes_merge_finetune_lr2e3_10k_d768

training_parameters:
  num_training_steps: 10000
  eval_interval: 2000
  micro_batch_size: 4
  gradient_accumulation_steps: 4
  eval_during_training: false
  gradient_clipping: 1

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 2e-3
    weight_decay: 0.1
    betas:
      - 0.9
      - 0.95
    eps: 1e-8

lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 200
  num_constant_steps: 0
  num_decay_steps: 9800

mixed_precision_args:
  dtype: bf16

distributed_args:
  fsdp_algorithm: 2
  torch_compile: true
  stage: 0
