# EGPT-RL: FULL-PER-TOKEN-GRADIENT h1 (6 GPT + 1 EGPT × 6) at d=768, LRA-16.
# Implements the chain-rule-correct +∇_h E_B at h_B for E_B = -LSE_B:
#   1) Q-role (existing attn_out)
#   2) self-K diagonal (alpha_BB * q_B projected by W_K^T)  [auto-enabled]
#   3) Rayleigh tangent projection P_g  (RMSNorm Jacobian's tangent piece)
#   4) Radial scaling sqrt(d)/||h||  (RMSNorm Jacobian's radial piece)
#   5) Sign flip  (E = -LSE → +∇E = -[+∇LSE_partial])
# After (1)-(5), grad_E = +∇_h E_B exactly (autograd-equivalent at single
# position, causally safe by construction since E_B only depends on h_{<=B}).
# Update h := h - proj(grad_E) gives true gradient descent in E by the PSDA
# identity dE/dt = -|S^T ∇E|^2 ≤ 0. Companion to math_psda_h1_d768_lra16
# (partial-grad) and math_psda_h1_d768_lra16_skd (Q+self-K only).

datasets:
- class_name: MegatronDataset
  data_name: Megatron
  data_sampling_ratio: 1
  class_args:
    eval_steps: 2
    data_cache_path: /proj/dmfexp/nima/.cache/megatron
    data_path:
    - 0.35
    - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
    - 0.35
    - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
    - 0.15
    - /proj/datasets/granite-4-datasets-megatron-merged/megamath-web-pro_0
    - 0.15
    - /proj/datasets/granite-4-datasets-megatron-merged/finemath-3plus-rewritten_0
    split: 99,0.5,0.5
    sequence_length: 4096
tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken
model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: energy
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations:
    - 1
    - 1
    - 1
    - 1
    - 1
    - 1
    - 6
    iter_dropout_range_per_block:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    - 3
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 768
    num_layers: 7
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: psd_anti
    energy_proj_rank: 0
    energy_antisym_rank: 16
    energy_apply_rayleigh: true
    energy_full_per_token_grad: true   # NEW: chain-rule full +∇_h E_B (auto-enables self-K-diag)
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
    - &id001
      sequence_mixer_type: softmax_attention
      num_attention_heads: 12
      num_key_value_heads: 12
      add_bias: false
      attention_multiplier: 0.125
    - *id001
    - *id001
    - *id001
    - *id001
    - *id001
    - sequence_mixer_type: energy_attention
      num_attention_heads: 12
      num_key_value_heads: 12
      add_bias: false
      attention_multiplier: 0.125
    mlp_blocks:
    - &id002
      mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 4096
      add_bias: false
    - *id002
    - *id002
    - *id002
    - *id002
    - *id002
    - mlp_type: Energy_MLP
      activation_function: swiglu
      intermediate_size: 4096
      add_bias: false
tuning_args:
  tuning_method: pretraining
save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/energy-inference/results/multi-block-ablation/math_psda_h1_d768_lra16_fpt_itd3
  save_interval: 2000
  max_to_keep: 3
logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: EGPT-RL
    name: math_psda_h1_d768_lra16_fpt_itd3
training_parameters:
  num_training_steps: 30000
  eval_interval: 10000
  micro_batch_size: 4          # same as partial-grad reference; only T×T scores
  gradient_accumulation_steps: 4   # are materialized for row-LSE (no alpha tensor)
  eval_during_training: false
  gradient_clipping: 0.5
optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 0.002
    weight_decay: 0.1
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000
  num_constant_steps: 0
  num_decay_steps: 28000
mixed_precision_args:
  dtype: bf16
distributed_args:
  fsdp_algorithm: 2
  torch_compile: true
  stage: 0
