# reg_h1_6gpt_1egpt6x_d768_r128: H1 (6GPT+1EGPT×6 d=768) + 128 registers — registers on the V73-small hybrid
datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path: /proj/dmfexp/nima/.cache/megatron
      data_path:
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
      split: 99.5,0.5,0
      sequence_length: 4096
tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken
model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    bos_token_id: 100257
    energy_proj_type: dual_unconstrained
    eos_token_id: 100257
    hidden_size: 768
    init_method: normal
    initializer_range: 0.02
    layer_iterations: [1, 1, 1, 1, 1, 1, 6]
    layer_norm_epsilon: 1.0e-05
    max_position_embeddings: 4096
    mlp_blocks:
    - {activation_function: swiglu, add_bias: false, intermediate_size: 2048, mlp_type: MLP}
    - {activation_function: swiglu, add_bias: false, intermediate_size: 2048, mlp_type: MLP}
    - {activation_function: swiglu, add_bias: false, intermediate_size: 2048, mlp_type: MLP}
    - {activation_function: swiglu, add_bias: false, intermediate_size: 2048, mlp_type: MLP}
    - {activation_function: swiglu, add_bias: false, intermediate_size: 2048, mlp_type: MLP}
    - {activation_function: swiglu, add_bias: false, intermediate_size: 2048, mlp_type: MLP}
    - {activation_function: swiglu, add_bias: false, intermediate_size: 2048, mlp_type: Energy_MLP}
    model_type: register_energy
    n_registers: 128
    normalization_function: rmsnorm
    num_iterations: 1
    num_layers: 7
    num_post_layers: 0
    num_pre_layers: 0
    pad_token_id: 100256
    position_embedding_type: rope
    rope_dim: 64
    sequence_mixer_blocks:
    - {add_bias: false, attention_multiplier: 0.125, num_attention_heads: 12, num_key_value_heads: 12,
      sequence_mixer_type: softmax_attention}
    - {add_bias: false, attention_multiplier: 0.125, num_attention_heads: 12, num_key_value_heads: 12,
      sequence_mixer_type: softmax_attention}
    - {add_bias: false, attention_multiplier: 0.125, num_attention_heads: 12, num_key_value_heads: 12,
      sequence_mixer_type: softmax_attention}
    - {add_bias: false, attention_multiplier: 0.125, num_attention_heads: 12, num_key_value_heads: 12,
      sequence_mixer_type: softmax_attention}
    - {add_bias: false, attention_multiplier: 0.125, num_attention_heads: 12, num_key_value_heads: 12,
      sequence_mixer_type: softmax_attention}
    - {add_bias: false, attention_multiplier: 0.125, num_attention_heads: 12, num_key_value_heads: 12,
      sequence_mixer_type: softmax_attention}
    - {add_bias: false, attention_multiplier: 0.125, num_attention_heads: 12, num_key_value_heads: 12,
      sequence_mixer_type: energy_attention}
    tie_word_embeddings: true
    vocab_size: 100352
save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/energy-inference/results/multi-block-ablation/reg_h1_6gpt_1egpt6x_d768_r128
  save_interval: 5000
  max_to_keep: 2
logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: energy-inference-large
    name: reg_h1_6gpt_1egpt6x_d768_r128
tuning_args:
  tuning_method: pretraining
training_parameters:
  num_training_steps: 30000
  eval_interval: 5000
  micro_batch_size: 4
  gradient_accumulation_steps: 4
  eval_during_training: false
  gradient_clipping: 1
optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 2e-3
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-8
lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000
  num_constant_steps: 0
  num_decay_steps: 28000
mixed_precision_args:
  dtype: bf16
distributed_args:
  fsdp_algorithm: 2
  torch_compile: true
  stage: 0
