# Paper-exact EGPT-Dual (400M) + 64 register tokens, EGPT-only placement.
#
# RECOVERY EXPERIMENT (2026-07-27). Reproduces the paper's 400M EGPT-Dual
# architecture EXACTLY (8 softmax_attention + 4 DISTINCT energy blocks,
# per-block iters [3,4,6,9], iter_dropout +-[1,2,2,4], d=1280, int=5120,
# proj_mode:split == dual_unconstrained/no-Rayleigh/no-FET) and adds R=64
# registers to the 4 energy blocks (register_start_layer 8) to test the
# value-tying-recovery hypothesis: EAttn ties W_V into span(W_Q^T W_K),
# denying the energy blocks the free scratch space RecGPT/deep-GPT enjoy;
# registers return extra residual rank. If GSM8K/BBH recover toward RecGPT,
# that is evidence FOR the value-tying hypothesis.
#
# Source paper config: /proj/dmfexp/energy-gpt/bs-configs-generated-egpt_400m/
#   410m_hybrid_s8e4_split_lr2e3_60k_538187.yml  (proj_mode: split)
# Baseline (iso, no reg): math_egptdual_r0_split_d1280_int5120_60k.yml (n_registers: 0)
#
# proj_mode:split -> dolomite energy_proj_type: dual_unconstrained
#   (layer.py:644 "separate unconstrained matrices for attn and MLP"),
#   energy_apply_rayleigh: false, energy_full_per_token_grad: false.
# Data mix is byte-identical to the paper 400M mix (0.35/0.35/0.15/0.15).
# 60k steps x mb4 x ga4 x 32 GPU x 4096 = 125.8B (~126B) tokens.
# NOTE: dolomite treats softmax_attention as an alias for
#   softmax_attention (config/__init__.py:84), so the block is sequential attn
#   then MLP; the +reg vs -reg comparison stays iso-codebase (baseline = r0).

datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path: /proj/dmfexp/nima/.cache/megatron
      data_path:
        - 0.35
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
        - 0.35
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
        - 0.15
        - /proj/datasets/granite-4-datasets-megatron-merged/megamath-web-pro_0
        - 0.15
        - /proj/datasets/granite-4-datasets-megatron-merged/finemath-3plus-rewritten_0
      split: 99,0.5,0.5
      sequence_length: 4096

tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken

model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: register_energy
    n_registers: 0
    register_start_layer: 8                  # only the 4 energy blocks see registers
    register_generation_mode: no_cache       # decode-bug fix (2026-06-29)
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations: [1, 1, 1, 1, 1, 1, 1, 1, 3, 4, 6, 9]
    iter_dropout_range_per_block: [0, 0, 0, 0, 0, 0, 0, 0, 1, 2, 2, 4]
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 1280
    num_layers: 12
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: dual_unconstrained
    energy_apply_rayleigh: false
    energy_full_per_token_grad: false
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
      - &gpt_attn
        sequence_mixer_type: softmax_attention
        num_attention_heads: 20
        num_key_value_heads: 20
        add_bias: false
        attention_multiplier: 0.125
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - &egpt_attn
        sequence_mixer_type: energy_attention
        num_attention_heads: 20
        num_key_value_heads: 20
        add_bias: false
        attention_multiplier: 0.125
      - *egpt_attn
      - *egpt_attn
      - *egpt_attn
    mlp_blocks:
      - &gpt_ffn
        mlp_type: MLP
        activation_function: swiglu
        intermediate_size: 5120
        add_bias: false
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - &egpt_ffn
        mlp_type: Energy_MLP
        intermediate_size: 5120
        add_bias: false
      - *egpt_ffn
      - *egpt_ffn
      - *egpt_ffn

tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/energy-inference/results/multi-block-ablation/math_egptdual_seed1234_split_d1280_int5120_63b_pmt8gpu
  save_interval: 100
  max_to_keep: 5

logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: EGPT-action
    name: math_egptdual_seed1234_split_d1280_int5120_63b_pmt8gpu

training_parameters:
  num_training_steps: 30000
  eval_interval: 10000
  micro_batch_size: 4
  gradient_accumulation_steps: 32
  eval_during_training: false
  gradient_clipping: 1

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 0.002
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-08

lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000
  num_constant_steps: 0
  num_decay_steps: 28000

mixed_precision_args:
  dtype: bf16

distributed_args:
  fsdp_algorithm: 2
  gradient_checkpointing_method: block
  torch_compile: true
  stage: 0

random_args:
  seed: 1234
