# EGPT-action: 400M-class h1 hybrid (8 GPT + 1 EGPT × 6 recurrent) with
# PSD-anti-LRA (rank 32) projection AND full-per-token gradient (FPT).
#
# This is the scale-up of math_psda_h1_d768_lra16_fpt (156M) to ~408M, with
# d=1536 matching the boltzmann-moe 580M dims. Architecture is plain h1 — NO
# Boltzmann-MoE; the EGPT block uses a single Energy_MLP (not BoltzmannMoE_Energy_MLP).
#
# Param breakdown (approx, vocab=100352, tied embeddings):
#   Embedding:  154M  (100352 × 1536)
#   GPT layers: 226M  (8 × (4×1536² + 3×1536×4096))   ≈ 28.3M / layer
#   EGPT block:  28M  (1 × (4×1536² + 3×1536×4096))
#   Total:      ~408M
#
# Training: 126B tokens at 32 GPUs (4 nodes × 8) × mb=4 × ga=1 × seq=4096
#   tokens/step = 524,288  (matches boltz 580M's tok/step exactly so LR transfers)
#   steps = 126e9 / 524288 ≈ 240,000 steps
# LR: 1e-3 (matching boltz d=1536; lower than d=768's 2e-3 due to wider model).
# Effective batch matches boltz 580M (8 GPU mb=4 ga=4 = 32 GPU mb=4 ga=1) so the
# proven LR schedule transfers directly.

datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path: /proj/dmfexp/nima/.cache/megatron
      data_path:
        - 0.35
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
        - 0.35
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
        - 0.15
        - /proj/datasets/granite-4-datasets-megatron-merged/megamath-web-pro_0
        - 0.15
        - /proj/datasets/granite-4-datasets-megatron-merged/finemath-3plus-rewritten_0
      split: 99,0.5,0.5
      sequence_length: 4096

tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken

model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: energy
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations: [1, 1, 1, 1, 1, 1, 1, 1, 6]
    iter_dropout_range_per_block: [0, 0, 0, 0, 0, 0, 0, 0, 3]   # EGPT block trains with 6±3 iters from step 0
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 1536
    num_layers: 9
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: psd_anti
    energy_proj_rank: 0           # 0 → full rank S
    energy_antisym_rank: 32       # PSDA-LRA-32 (proven to recover bucket signal at d=1280)
    energy_apply_rayleigh: true
    energy_full_per_token_grad: true   # FPT: chain-rule full +∇_h E_B (auto-enables self-K-diag)
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
      - &gpt_attn
        sequence_mixer_type: softmax_attention
        num_attention_heads: 24
        num_key_value_heads: 24
        add_bias: false
        attention_multiplier: 0.125
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - sequence_mixer_type: energy_attention
        num_attention_heads: 24
        num_key_value_heads: 24
        add_bias: false
        attention_multiplier: 0.125
    mlp_blocks:
      - &gpt_ffn
        mlp_type: MLP
        activation_function: swiglu
        intermediate_size: 4096
        add_bias: false
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - mlp_type: Energy_MLP
        activation_function: swiglu
        intermediate_size: 4096
        add_bias: false

tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/energy-inference/results/multi-block-ablation/math_psda_h1_8gpt_1egpt6x_d1536_lra32_fpt_itd3_24gpu
  save_interval: 2000
  max_to_keep: 8

logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: EGPT-action
    name: math_psda_h1_8gpt_1egpt6x_d1536_lra32_fpt_itd3_24gpu

training_parameters:
  num_training_steps: 320000       # 126B tokens at 24 GPUs (mb=4, ga=1, seq=4096) = 393k tok/step
  eval_interval: 20000
  micro_batch_size: 4
  gradient_accumulation_steps: 1
  eval_during_training: false
  gradient_clipping: 0.5

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 0.001
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-08

lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 4000
  num_constant_steps: 0
  num_decay_steps: 316000

mixed_precision_args:
  dtype: bf16

distributed_args:
  fsdp_algorithm: 2
  gradient_checkpointing_method: block
  torch_compile: false
  stage: 0
