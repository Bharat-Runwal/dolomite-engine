# FET-1.5e-3 baseline: same arch as the original FET (8G+1Ex6 d=1536 LRA-32
# itd3 psd_anti energy_full_per_token_grad), but trained from scratch with the
# same batching/schedule as math_recgpt (1.05M tok/step, 32k steps, peak 1.5e-3).
# This isolates the energy/descent contribution from "having a recurrent block"
# under MATCHED training compute and matched LR. Direct head-to-head vs
# math_recgpt at iso-tokens.
#
# Key differences vs the original FET-1e-3 16gpu config:
#   - peak LR 1.5e-3 (was 1.0e-3) — matches scaled-from-160M-2e-3 heuristic for 400M
#   - 32k steps × 1.05M tok/step = 33.5B tokens (was 240k × 524k = 126B target)
#   - 8 GPU single-node, mb=4, ga=8 (was 16 GPU, mb=4, ga=2)
#   - Trained from scratch (not from a 1e-3 checkpoint like lr2e4 was)

datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path: /proj/dmfexp/nima/.cache/megatron
      data_path:
        - 0.35
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
        - 0.35
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
        - 0.15
        - /proj/datasets/granite-4-datasets-megatron-merged/megamath-web-pro_0
        - 0.15
        - /proj/datasets/granite-4-datasets-megatron-merged/finemath-3plus-rewritten_0
      split: 99,0.5,0.5
      sequence_length: 4096

tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken

model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: energy
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations: [1, 1, 1, 1, 1, 1, 1, 1, 6]
    iter_dropout_range_per_block: [0, 0, 0, 0, 0, 0, 0, 0, 3]   # itd3 — block 8 trains 6±3 iters
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 1536
    num_layers: 9
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: psd_anti
    energy_proj_rank: 0
    energy_antisym_rank: 32
    energy_apply_rayleigh: true
    energy_full_per_token_grad: true
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
      - &gpt_attn
        sequence_mixer_type: softmax_attention
        num_attention_heads: 24
        num_key_value_heads: 24
        add_bias: false
        attention_multiplier: 0.125
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - sequence_mixer_type: energy_attention   # block 8: ENERGY (vs RecGPT's softmax_attention)
        num_attention_heads: 24
        num_key_value_heads: 24
        add_bias: false
        attention_multiplier: 0.125
    mlp_blocks:
      - &gpt_ffn
        mlp_type: MLP
        activation_function: swiglu
        intermediate_size: 4096
        add_bias: false
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - mlp_type: Energy_MLP                    # block 8: ENERGY MLP (vs RecGPT's MLP)
        activation_function: swiglu
        intermediate_size: 4096
        add_bias: false

tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/energy-inference/results/multi-block-ablation/math_fet_8gpt_1egpt6x_d1536_lra32_itd3_lr1p5e3_33b_8gpu
  save_interval: 2000
  max_to_keep: 5

logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: EGPT-action
    name: math_fet_8gpt_1egpt6x_d1536_lra32_itd3_lr1p5e3_33b_8gpu

training_parameters:
  num_training_steps: 32000          # 32k × 1.05M tok/step = 33.5B (matches RecGPT/V9 baselines)
  eval_interval: 8000
  micro_batch_size: 4
  gradient_accumulation_steps: 8
  eval_during_training: false
  gradient_clipping: 0.5             # FET-style (was 0.5 in original FET; vs 1.0 in RecGPT/V9)

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 0.0015                       # peak 1.5e-3 — higher than original FET's 1e-3
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-08

lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1               # peak 1.5e-3 → min 1.5e-4
  num_warmup_steps: 2000
  num_constant_steps: 0
  num_decay_steps: 30000

mixed_precision_args:
  dtype: bf16

distributed_args:
  fsdp_algorithm: 2
  gradient_checkpointing_method: block
  torch_compile: false
  stage: 0
