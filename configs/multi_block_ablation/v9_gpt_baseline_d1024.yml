# V9: Standard GPT baseline at 400M scale — 24L, d=1024, SwiGLU int=2048, RoPE, RMSNorm
# Iso-param to V1 400M (354M total / 251M non-embed):
#   standard attn (Q,K,V,O) + 3-matrix SwiGLU at int=2048
#   matches V1's non-embed budget exactly
#   (V1 uses energy_attn(QK-only) + 2-matrix Energy_MLP at int=3072 — different per-component
#    split but same total transformer parameter count)
#
# muP LR scaling from V0 (d=768, lr=2e-3): 2e-3 × 768/1024 ≈ 1.5e-3
#
# 30k steps × 4 GPUs × batch=4 × grad_accum=4 × seq=4096 = 7.86B tokens
# (same token budget as V1 400M at 30k, and same as V0/V1 160M)
# Est. ~1.5-2h/4h-chunk on 4 A100s

datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path: /proj/dmfexp/nima/.cache/megatron
      data_path:
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
      split: 99.5,0.5,0
      sequence_length: 4096

tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken

model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: gpt_base
    num_iterations: 0
    initializer_range: 0.02
    layer_norm_epsilon: 1e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64             # 1024 / 16 heads = 64 per head
    hidden_size: 1024
    num_layers: 24
    init_method: normal
    tie_word_embeddings: true
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 16, num_key_value_heads: 16, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 16, num_key_value_heads: 16, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 16, num_key_value_heads: 16, add_bias: false, attention_multiplier: 0.125}
