# Hopfield-MEAN + 256 register tokens — registers on the FET substrate.
#
# Same backbone as math_fet_hopfield_mean_*_16gpu.yml (8 GPT + 1 EGPT×6,
# d=1536, PSD-anti + Rayleigh + FPT, single-W Hopfield E = ||gelu(Wh)||²/d_int,
# intermediate_size=8192). The ONLY difference: model_type switched from
# "energy" to "register_energy" with n_registers=256 — registers are
# prepended to the hidden sequence before block forwards and stripped off
# after, giving the model 256 learnable "global working memory" tokens.
#
# Why: the Hopfield-MEAN base run hit avg10_norm 0.5135 / R3 lift +0.38pp.
# Registers reliably lift zero-shot LM-eval by 2-3pp on uniform-EGPT and
# h1 hybrids (see memory project_register_gsm8k_collapse — caveat: they
# DO kill GSM8K generation on most archs; track GSM8K closely here).
# This run measures whether registers also enhance the verifier signal
# on the Hopfield substrate. register_start_layer defaults to 0 so they
# attend through all 9 blocks including the EGPT recurrence at the end.

datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path: /proj/dmfexp/nima/.cache/megatron
      data_path:
        - 0.35
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
        - 0.35
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
        - 0.15
        - /proj/datasets/granite-4-datasets-megatron-merged/megamath-web-pro_0
        - 0.15
        - /proj/datasets/granite-4-datasets-megatron-merged/finemath-3plus-rewritten_0
      split: 99,0.5,0.5
      sequence_length: 4096

tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken

model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: register_energy
    n_registers: 256
    register_generation_mode: bypass
    register_start_layer: 0
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations: [1, 1, 1, 1, 1, 1, 1, 1, 6]
    iter_dropout_range_per_block: [0, 0, 0, 0, 0, 0, 0, 0, 3]
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 1536
    num_layers: 9
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: psd_anti
    energy_proj_rank: 0
    energy_antisym_rank: 32
    energy_apply_rayleigh: true
    energy_full_per_token_grad: true
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
      - &gpt_attn
        sequence_mixer_type: softmax_attention
        num_attention_heads: 24
        num_key_value_heads: 24
        add_bias: false
        attention_multiplier: 0.125
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - sequence_mixer_type: energy_attention
        num_attention_heads: 24
        num_key_value_heads: 24
        add_bias: false
        attention_multiplier: 0.125
    mlp_blocks:
      - &gpt_ffn
        mlp_type: MLP
        activation_function: swiglu
        intermediate_size: 4096
        add_bias: false
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - mlp_type: Hopfield_Energy_MLP                   # bounded-below FFN energy (same as base)
        activation_function: gelu
        intermediate_size: 8192                          # 2× Energy_MLP for iso-param
        add_bias: false

tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/energy-inference/results/multi-block-ablation/math_fet_hopfield_mean_r256_8gpt_1egpt6x_d1536_int8k_lra32_itd3_lr1p5e3_33b_16gpu
  save_interval: 2000
  max_to_keep: 5

logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: EGPT-action
    name: math_fet_hopfield_mean_r256_8gpt_1egpt6x_d1536_int8k_lra32_itd3_lr1p5e3_33b_16gpu

training_parameters:
  num_training_steps: 32000          # 32k × 1.05M tok/step = 33.5B (matches base)
  eval_interval: 8000
  micro_batch_size: 4
  gradient_accumulation_steps: 4     # 16 GPU × mb=4 × ga=4 = 1.05M tok/step
  eval_during_training: false
  gradient_clipping: 0.5

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 0.0015                       # iso with Hopfield-MEAN base
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-08

lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000
  num_constant_steps: 0
  num_decay_steps: 30000

mixed_precision_args:
  dtype: bf16

distributed_args:
  fsdp_algorithm: 2
  gradient_checkpointing_method: block
  torch_compile: false
  stage: 0
