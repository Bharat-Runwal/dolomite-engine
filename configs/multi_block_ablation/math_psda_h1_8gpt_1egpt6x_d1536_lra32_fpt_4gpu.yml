# 4-GPU fallback for math_psda_h1_8gpt_1egpt6x_d1536_lra32_fpt.
# Same architecture, same effective batch (mb=4 × ga=8 × 4 GPU = 524k tok/step),
# same total tokens target. ONLY use if 32-GPU normal queue stays pended too long.
# Saves to a SEPARATE save_path so the 32-GPU run is not contaminated if both
# accidentally run.

datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path: /proj/dmfexp/nima/.cache/megatron
      data_path:
        - 0.35
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
        - 0.35
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
        - 0.15
        - /proj/datasets/granite-4-datasets-megatron-merged/megamath-web-pro_0
        - 0.15
        - /proj/datasets/granite-4-datasets-megatron-merged/finemath-3plus-rewritten_0
      split: 99,0.5,0.5
      sequence_length: 4096

tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken

model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: energy
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations: [1, 1, 1, 1, 1, 1, 1, 1, 6]
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 1536
    num_layers: 9
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: psd_anti
    energy_proj_rank: 0
    energy_antisym_rank: 32
    energy_apply_rayleigh: true
    energy_full_per_token_grad: true
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
      - &gpt_attn
        sequence_mixer_type: softmax_attention
        num_attention_heads: 24
        num_key_value_heads: 24
        add_bias: false
        attention_multiplier: 0.125
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - sequence_mixer_type: energy_attention
        num_attention_heads: 24
        num_key_value_heads: 24
        add_bias: false
        attention_multiplier: 0.125
    mlp_blocks:
      - &gpt_ffn
        mlp_type: MLP
        activation_function: swiglu
        intermediate_size: 4096
        add_bias: false
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - mlp_type: Energy_MLP
        activation_function: swiglu
        intermediate_size: 4096
        add_bias: false

tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/energy-inference/results/multi-block-ablation/math_psda_h1_8gpt_1egpt6x_d1536_lra32_fpt_4gpu
  save_interval: 2000
  max_to_keep: 8

logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: EGPT-action
    name: math_psda_h1_8gpt_1egpt6x_d1536_lra32_fpt_4gpu

training_parameters:
  num_training_steps: 240000       # 126B tokens at 4 GPUs (mb=4, ga=8, seq=4096) = 524k tok/step
  eval_interval: 20000
  micro_batch_size: 4
  gradient_accumulation_steps: 8
  eval_during_training: false
  gradient_clipping: 0.5

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 0.001
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-08

lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 4000
  num_constant_steps: 0
  num_decay_steps: 236000

mixed_precision_args:
  dtype: bf16

distributed_args:
  fsdp_algorithm: 2
  gradient_checkpointing_method: block
  torch_compile: false
  stage: 0
