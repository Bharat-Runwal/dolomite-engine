# V68: Deep GPT — 12 layers × 1 pass, d=448
# Param-matched baseline to V56/V65/V66 (~83M total).
# d=448, 7 heads (head_dim=64), int=1792 (4×), 12 layers:
#   Embedding: 100352 × 448 = 44.96M
#   Per layer: 4 × 448² (attn) + 3 × 448 × 1792 (SwiGLU) = 0.80M + 2.41M = 3.21M
#   12 layers: 38.53M
#   Total: 83.5M ≈ 85M ← compare to V56's 84M
#
# Note: V0 is the iso-compute deep GPT (d=768, 12L, 162M). V68 is iso-params to the
# recurrent EGPT variants (V56/V65/V66 at ~84M), i.e. "same params, all in layers vs embedding".
# muP lr: 2e-3 × 768/448 ≈ 3.4e-3 → using 3e-3 for slight conservatism.
#
# Research question: Does a deep GPT with same total params (but more transformer layers)
# outperform the recurrent EGPT despite having much more embedding params (45M vs 0.1M)?
#
# 30k steps × 4 GPUs × batch=4 × grad_accum=4 × seq=4096 = 7.86B tokens

datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path: /proj/dmfexp/nima/.cache/megatron
      data_path:
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
      split: 99.5,0.5,0
      sequence_length: 4096

tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken

model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: gpt_base
    num_iterations: 0
    initializer_range: 0.02
    layer_norm_epsilon: 1e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 448
    num_layers: 12
    init_method: normal
    tie_word_embeddings: true
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 7, num_key_value_heads: 7, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 7, num_key_value_heads: 7, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 7, num_key_value_heads: 7, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 7, num_key_value_heads: 7, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 7, num_key_value_heads: 7, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 7, num_key_value_heads: 7, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 7, num_key_value_heads: 7, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 7, num_key_value_heads: 7, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 7, num_key_value_heads: 7, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 7, num_key_value_heads: 7, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 7, num_key_value_heads: 7, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 7, num_key_value_heads: 7, add_bias: false, attention_multiplier: 0.125}
    mlp_blocks:
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 1792, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 1792, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 1792, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 1792, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 1792, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 1792, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 1792, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 1792, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 1792, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 1792, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 1792, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 1792, add_bias: false}

tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/energy-inference/results/multi-block-ablation/v68_gpt_deep_12x1_d448_lr3e3
  save_interval: 5000
  max_to_keep: 6

logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: energy-inference-large
    name: v68_gpt_deep_12x1_d448_lr3e3

training_parameters:
  num_training_steps: 30000
  eval_interval: 5000
  micro_batch_size: 4
  gradient_accumulation_steps: 4
  eval_during_training: false
  gradient_clipping: 1

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 3e-3
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1e-8

lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000
  num_constant_steps: 0
  num_decay_steps: 28000

mixed_precision_args:
  dtype: bf16

distributed_args:
  fsdp_algorithm: 2
  torch_compile: true
  stage: 0
