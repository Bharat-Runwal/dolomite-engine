datasets:
- class_name: MegatronDataset
  data_name: Megatron
  data_sampling_ratio: 1
  class_args:
    eval_steps: 2
    data_cache_path: /proj/dmfexp/nima/.cache/megatron
    data_path:
    - 0.5
    - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
    - 0.5
    - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
    split: 99.5,0.5,0
    sequence_length: 4096
tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken
model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: energy
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations:
    - 1
    - 1
    - 1
    - 1
    - 1
    - 1
    - 1
    - 1
    - 3
    - 4
    - 6
    - 9
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 1280
    num_layers: 12
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: dual_unconstrained
    energy_apply_rayleigh: false
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
    - &id001
      sequence_mixer_type: softmax_attention
      num_attention_heads: 20
      num_key_value_heads: 20
      add_bias: false
      attention_multiplier: 0.125
    - *id001
    - *id001
    - *id001
    - *id001
    - *id001
    - *id001
    - *id001
    - &id002
      sequence_mixer_type: energy_attention
      num_attention_heads: 20
      num_key_value_heads: 20
      add_bias: false
      attention_multiplier: 0.125
    - *id002
    - *id002
    - *id002
    mlp_blocks:
    - &id003
      mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 4096
      add_bias: false
    - *id003
    - *id003
    - *id003
    - *id003
    - *id003
    - *id003
    - *id003
    - &id004
      mlp_type: Energy_MLP
      activation_function: swiglu
      intermediate_size: 4096
      add_bias: false
    - *id004
    - *id004
    - *id004
tuning_args:
  tuning_method: pretraining
save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/energy-inference/results/multi-block-ablation/v72_hybrid_8gpt_4egpt_layernorm_d1280
  save_interval: 1000
  max_to_keep: 4
logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: energy-inference-large
    name: v72_hybrid_8gpt_4egpt_layernorm_d1280
training_parameters:
  num_training_steps: 30000
  eval_interval: 5000
  micro_batch_size: 4
  gradient_accumulation_steps: 8
  eval_during_training: false
  gradient_clipping: 1
optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 0.002
    weight_decay: 0.1
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000
  num_constant_steps: 0
  num_decay_steps: 28000
mixed_precision_args:
  dtype: bf16
distributed_args:
  fsdp_algorithm: 2
  torch_compile: true
  stage: 0
