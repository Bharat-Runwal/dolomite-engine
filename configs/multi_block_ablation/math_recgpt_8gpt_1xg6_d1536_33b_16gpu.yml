# RecGPT baseline: same architecture as the FET 8G+1Ex6 d=1536 hybrid, but
# replacing the EGPT block with a vanilla GPT block run 6× (no energy descent).
#   layer_iterations = [1, 1, 1, 1, 1, 1, 1, 1, 6]   (same as FET)
#   block 8: softmax_attention + standard MLP   (vs FET's energy_attention + Energy_MLP)
# This isolates the contribution of the descent-constrained per-token energy
# vs. just having a recurrent block at the end. Trained on the same math mix,
# same scale, same total tokens (≥33B) as the FET baseline.
# 16 GPU multi-node, normal queue grp_ebm, 32k steps × 524k tok/step = 16.8B tokens.
# Wait — FET h1 uses mb=4 ga=2, so the 524k = 4*2*16*4096. So 32k steps = 16.8B
# tokens. Need 64k steps for 33B. Going with mb=4 ga=4 for 1.05M tok/step,
# 32k steps = 33.5B (matches math_v9 above and FET step 8k 33.6B).

datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path: /proj/dmfexp/nima/.cache/megatron
      data_path:
        - 0.35
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
        - 0.35
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
        - 0.15
        - /proj/datasets/granite-4-datasets-megatron-merged/megamath-web-pro_0
        - 0.15
        - /proj/datasets/granite-4-datasets-megatron-merged/finemath-3plus-rewritten_0
      split: 99,0.5,0.5
      sequence_length: 4096

tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken

model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: energy
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations: [1, 1, 1, 1, 1, 1, 1, 1, 6]   # same as FET h1; block 8 runs 6 times
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 1536
    num_layers: 9
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: dual_unconstrained   # ignored by softmax_attention blocks
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
      - &gpt_attn
        sequence_mixer_type: softmax_attention
        num_attention_heads: 24
        num_key_value_heads: 24
        add_bias: false
        attention_multiplier: 0.125
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn   # block 8: ALSO softmax_attention (the only difference vs FET)
    mlp_blocks:
      - &gpt_ffn
        mlp_type: MLP
        activation_function: swiglu
        intermediate_size: 4096
        add_bias: false
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn   # block 8 MLP: ALSO standard MLP (vs FET's Energy_MLP)

tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/energy-inference/results/multi-block-ablation/math_recgpt_8gpt_1xg6_d1536_33b_16gpu
  save_interval: 2000
  max_to_keep: 5

logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: EGPT-action
    name: math_recgpt_8gpt_1xg6_d1536_33b_16gpu

training_parameters:
  num_training_steps: 32000   # 32k × 1.05M tok/step = 33.5B tokens (matches FET step 8k = 33.6B)
  eval_interval: 8000
  micro_batch_size: 4
  gradient_accumulation_steps: 8
  eval_during_training: false
  gradient_clipping: 1.0

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 0.001                       # 1e-3 cosine — same as math_v9 baseline
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-08

lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1              # peak 1e-3 → min 1e-4
  num_warmup_steps: 2000
  num_constant_steps: 0
  num_decay_steps: 30000

mixed_precision_args:
  dtype: bf16

distributed_args:
  fsdp_algorithm: 2
  torch_compile: false
  stage: 0
