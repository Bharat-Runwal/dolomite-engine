datasets:
- class_args:
    data_cache_path: /proj/dmfexp/nima/.cache/megatron
    data_path:
    - 0.5
    - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
    - 0.5
    - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
    eval_steps: 2
    sequence_length: 4096
    split: 99.5,0.5,0
  class_name: MegatronDataset
  data_name: Megatron
  data_sampling_ratio: 1
distributed_args:
  fsdp_algorithm: 2
  stage: 0
  torch_compile: true
logging_args:
  experiments_tracker_name: wandb
  log_interval: 10
  wandb_args:
    name: v78_6gpt_1gptrec6x_d1280
    project: energy-inference-large
lr_scheduler_args:
  lr_decay_factor: 0.1
  lr_decay_style: cosine
  num_constant_steps: 0
  num_decay_steps: 28000
  num_warmup_steps: 2000
mixed_precision_args:
  dtype: bf16
model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    bos_token_id: 100257
    eos_token_id: 100257
    hidden_size: 1280
    init_method: normal
    initializer_range: 0.02
    layer_iterations:
    - 1
    - 1
    - 1
    - 1
    - 1
    - 1
    - 6
    layer_norm_epsilon: 1.0e-05
    max_position_embeddings: 4096
    mlp_blocks:
    - &id001
      activation_function: swiglu
      add_bias: false
      intermediate_size: 4096
      mlp_type: MLP
    - *id001
    - *id001
    - *id001
    - *id001
    - *id001
    - activation_function: swiglu
      add_bias: false
      intermediate_size: 4096
      mlp_type: MLP
    model_type: energy
    normalization_function: rmsnorm
    num_iterations: 1
    num_layers: 7
    num_post_layers: 0
    num_pre_layers: 0
    pad_token_id: 100256
    position_embedding_type: rope
    rope_dim: 64
    sequence_mixer_blocks:
    - &id002
      add_bias: false
      attention_multiplier: 0.125
      num_attention_heads: 20
      num_key_value_heads: 20
      sequence_mixer_type: softmax_attention
    - *id002
    - *id002
    - *id002
    - *id002
    - *id002
    - add_bias: false
      attention_multiplier: 0.125
      num_attention_heads: 20
      num_key_value_heads: 20
      sequence_mixer_type: softmax_attention
    tie_word_embeddings: true
    vocab_size: 100352
optimizer_args:
  class_args:
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    lr: 0.002
    weight_decay: 0.1
  class_name: TorchAdamW
save_args:
  max_to_keep: 4
  save_interval: 1000
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/energy-inference/results/multi-block-ablation/v78_6gpt_1gptrec6x_d1280
tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken
training_parameters:
  eval_during_training: false
  eval_interval: 5000
  gradient_accumulation_steps: 8
  gradient_clipping: 1
  micro_batch_size: 4
  num_training_steps: 30000
tuning_args:
  tuning_method: pretraining
