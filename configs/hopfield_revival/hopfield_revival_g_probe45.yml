# hopfield_revival_g_probe45
#
# grad prefactor 4/I_e -> 4/sqrt(I_e) (32x). Does the branch become load-bearing at all? Routing left flat on purpose, to isolate magnitude.
#
# Derived from math_fet_boltz_hopfield_rep_8gpt_1egpt6x_d1536_int8k_K8_lra32_itd3_lr1p5e3_33b_16gpu.yml by
# scripts/make_hopfield_revival_configs_20260912.py. Baseline measured DEAD:
# FF share of grad_E = 0.04%, effective_n_experts = 7.999/8, deleting the
# whole MoE branch moved ppl +0.0003 over 87,997 tokens.
#
# KNOBS SET HERE: {'hopfield_grad_scale': 'sqrt_consistent', 'repulsion_form': 'signed'}
# TO REVERT: delete those lines. Each defaults to pre-2026-09-12 behaviour.
# IF THIS DIVERGES: hopfield_grad_scale: mean restores the old prefactor
#   (run 1714840 NaN'd at step 3710 with the SUM form; these sit 32x below).
# 8 GPUs x mb=4 x ga=8 = 1.05M tok/step, iso with the 16-GPU baseline.
#
datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path: /proj/dmfexp/nima/.cache/megatron
      data_path:
        - 0.35
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
        - 0.35
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
        - 0.15
        - /proj/datasets/granite-4-datasets-megatron-merged/megamath-web-pro_0
        - 0.15
        - /proj/datasets/granite-4-datasets-megatron-merged/finemath-3plus-rewritten_0
      split: 99,0.5,0.5
      sequence_length: 4096

tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken

model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: energy
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations: [1, 1, 1, 1, 1, 1, 1, 1, 6]
    iter_dropout_range_per_block: [0, 0, 0, 0, 0, 0, 0, 0, 3]
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 1536
    num_layers: 9
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: psd_anti
    energy_proj_rank: 0
    energy_antisym_rank: 32
    energy_apply_rayleigh: true
    energy_full_per_token_grad: true
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
      - &gpt_attn
        sequence_mixer_type: softmax_attention
        num_attention_heads: 24
        num_key_value_heads: 24
        add_bias: false
        attention_multiplier: 0.125
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - sequence_mixer_type: energy_attention
        num_attention_heads: 24
        num_key_value_heads: 24
        add_bias: false
        attention_multiplier: 0.125
    mlp_blocks:
      - &gpt_ffn
        mlp_type: MLP
        activation_function: swiglu
        intermediate_size: 4096
        add_bias: false
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - mlp_type: EnergyFF_BoltzmannMoE                 # NEW composable refactor (2026-06-28)
        expert_kind: hopfield
        hopfield_grad_scale: sqrt_consistent
        repulsion_form: signed
        intermediate_size: 8192                          # total across K=8 experts (1024 each)
        n_experts: 8
        temperature: 1.0
        repulsion_coef: 0.01                             # THE A/B KNOB — restores expert diversity
        n_repulsion_pairs: 4
        gelu_grad_method: sigmoid
        activation_function: gelu
        add_bias: false

tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/energy-inference/results/hopfield-revival/hopfield_revival_g_probe45
  save_interval: 1000
  max_to_keep: 5

logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: EGPT-action
    name: hopfield_revival_g_probe45

training_parameters:
  num_training_steps: 4500
  eval_interval: 4500
  micro_batch_size: 4
  gradient_accumulation_steps: 8     # 8 GPU x mb=4 x ga=8 = 1.05M tok/step
  eval_during_training: false
  gradient_clipping: 0.5

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 0.0015                       # iso with FET-1.5e-3
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-08

lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 750
  num_constant_steps: 0
  num_decay_steps: 4500

mixed_precision_args:
  dtype: bf16

distributed_args:
  fsdp_algorithm: 2
  gradient_checkpointing_method: block
  torch_compile: false
  stage: 0
