# ============================================================
# MoE_Energy_F5: Boltzmann + KL Distillation — 32×1024 Experts, Slim Dense (512)
# ============================================================
# Dual-mode Energy MoE: Boltzmann routing at train, cheap linear gate at inference.
# Energy_MLP forward per expert (dual-path, weight-reuse):
#   W1x = W1(x), W2x = W2(x)
#   y1 = gelu(W1x), y2 = sigmoid(scale*W1x)*0.5*W2x
#   out = y1 @ W2.weight + y2 @ W1.weight
# KL distillation trains a linear router to match Boltzmann distribution.

datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path:  /proj/dmfexp/energy-gpt/cache-bsaha
      data_path:
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
      split: 99.5,0.5,0
      sequence_length: 4096

tokenizer_args:
  tokenizer_name: /proj/dmfexp/energy-gpt/data/granite-4.0-tiktoken

model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    initializer_range: 0.02
    layer_norm_epsilon: 1e-05
    model_type: energy
    normalization_function: rmsnorm
    position_embedding_type: rope
    hidden_size: 1024
    num_layers: 3
    init_method: normal
    tie_word_embeddings: true

    rope_dim: 64
    num_pre_layers: 1
    num_post_layers: 1
    num_iterations: 6

    router_aux_loss_coef: 0.001

    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096

    sequence_mixer_blocks:
      - add_bias: false
        attention_multiplier: 0.125
        num_attention_heads: 16
        num_key_value_heads: 16
        sequence_mixer_type: softmax_attention
      - sequence_mixer_type: energy_attention
        num_attention_heads: 16
        num_key_value_heads: 16
        add_bias: false
        attention_multiplier: 0.125
      - add_bias: false
        attention_multiplier: 0.125
        num_attention_heads: 16
        num_key_value_heads: 16
        sequence_mixer_type: softmax_attention

    mlp_blocks:
      - activation_function: swiglu
        add_bias: false
        intermediate_size: 512
        mlp_type: MLP
      - mlp_type: MoE_Energy_F5
        intermediate_size: 1024
        add_bias: false
        num_experts: 32
        num_experts_per_tok: 2
        normalized_topk: true
        boltzmann_temperature: 1.0
        learnable_temperature: true
        distillation_weight: 0.01
      - activation_function: swiglu
        add_bias: false
        intermediate_size: 512
        mlp_type: MLP

tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /proj/dmfexp/energy-gpt/checkpoints-bsaha/workshop_nfam/E9_F5_Energy_32x1024_slim
  save_interval: 5000

logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: dolomite
    name: E9_F5_Energy_32x1024_6iter_slim_baseline

training_parameters:
  num_training_steps: 30000
  eval_interval: 5000 #2500
  micro_batch_size: 2
  gradient_accumulation_steps: 4
  eval_during_training: false
  gradient_clipping: 1

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 3e-4
    weight_decay: 0.1
    betas:
      - 0.9
      - 0.95
    eps: 1e-10

lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000
  num_constant_steps: 0
  num_decay_steps: 28000

mixed_precision_args:
  dtype: bf16

distributed_args:
  fsdp_algorithm: 2
  torch_compile: false
  stage: 0
