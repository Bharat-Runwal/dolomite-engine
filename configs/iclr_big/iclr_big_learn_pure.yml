# 8-GPU (2026-09-13): ga 16->8 so 8 GPU x mbs1 x ga8 x 4096 = same tokens/step.
# OOM FIX (2026-09-13): first attempt OOM'd on 80GB (tried to alloc 3.06 GiB with
# ~1.9 GiB free). At d=1024 with I_e=17920 the per-expert activations at
# micro_batch_size=4 x 4096 tokens do not fit. Reduced to mbs=1 / ga=16, which
# holds tokens-per-step identical, and enabled block gradient checkpointing.
#
# iclr_big_learn_pure
#
# PURE single block, LEARNED router + load-balance loss, ~400M. Router control for big_hop_pure.
#
# ~400M TIER. d=1024, T=4 iterations, 15000 steps (~15.8B tokens).
# NOTE T=4 not 8 and 15000 not 30000: at T=8 a 400M single-block model is ~23h/run
# because the shipped code computes ALL experts densely, so FLOPs ~ I_tot*T. This tier
# is therefore its own iso-token/iso-depth group and is NOT directly comparable to the
# 134M T=8 30k-step arms. Compare within the tier.
#
datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path: /proj/dmfexp/nima/.cache/megatron
      data_path:
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
      split: 99.5,0.5,0
      sequence_length: 4096

tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken

model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: energy
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations: [4]
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 1024
    num_layers: 1
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: dual_unconstrained
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
      - sequence_mixer_type: energy_attention
        num_attention_heads: 16
        num_key_value_heads: 16
        add_bias: false
        attention_multiplier: 0.125
    mlp_blocks:
      - mlp_type: TopK_Energy_MoE_MLP
        intermediate_size: 8960
        n_experts: 16
        top_k: 2
        activation_function: gelu_pytorch_tanh
        add_bias: false
        dropout: 0.0
tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/boltzmann-moe/results/iclr_big/iclr_big_learn_pure
  save_interval: 2000
  max_to_keep: 2

logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: energy-inference-large
    name: iclr_big_learn_pure

training_parameters:
  num_training_steps: 15000
  eval_interval: 5000
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  eval_during_training: false
  gradient_clipping: 1

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 2e-3
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-8

lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 1000
  num_constant_steps: 0
  num_decay_steps: 15000

mixed_precision_args:
  dtype: bf16

distributed_args:
  fsdp_algorithm: 2
  gradient_checkpointing_method: block
  # torch_compile: false  (2026-09-13, jid 1589109 died after 30 min)
  #
  # ROOT CAUSE, traced to the exact pass. Inductor runs a diagnostic SPMD check in
  # post_grad_passes:
  #     spmd_check(gm) -> dist.all_gather_object(all_hashes, structure_hash, pg)
  # which requires EVERY rank to reach the same compile point together. Across 2
  # nodes the ranks did not, so the gloo all_gather blocked until its 1800 s
  # timeout and every rank raised
  #     InductorError: RuntimeError: [gloo/transport/tcp/unbound_buffer.cc:129]
  #     Timed out waiting 1800000ms for send operation
  # The pass is gated on `reorder_for_compute_comm_overlap`, which dolomite sets
  # unconditionally at lm_engine/distributed.py:57, so it is always on for us.
  #
  # This is the same failure already fixed this way on both Switch arms: a learned
  # router makes per-expert work DATA-DEPENDENT, which triggers rank-dependent
  # recompiles. The 8-GPU energy arm (iclr_big_hop_pure) compiles fine and keeps
  # torch_compile: true -- its routing is a dense masked mixture with static shapes.
  #
  # FAIRNESS: compile changes kernel fusion, not the function or the optimisation
  # trajectory, so the hop/learn comparison stays valid; only wall-clock differs.
  # A narrower alternative exists if speed becomes the binding constraint --
  #     torch._inductor.config.aten_distributed_optimizations.spmd_check = False
  # which drops only the diagnostic collective (its mismatch action defaults to
  # "warn", so it prevents nothing). Not used here: if the graphs really are
  # non-SPMD, that just moves the hang to a real NCCL collective later.
  torch_compile: false
  stage: 0
