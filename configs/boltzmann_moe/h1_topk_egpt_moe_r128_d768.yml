# h1_topk_egpt_moe_r128: H1 hybrid with TopK MoE EGPT + 128 registers
# Architecture: 6 GPT layers + 1 recurrent EGPT block (×6) with:
#   - TopK_Energy_MoE_MLP (4 full-size experts, top-2) in the EGPT block
#   - 128 register tokens (register_start_layer=6 → EGPT-only selective registers)
# Tests whether MoE capacity + register workspace combine additively.
# Baselines:
#   H1:              PPL 41.35, Avg 46.9%, GSM 2.05%, COPA 61%
#   h1-topk-moe:     PPL 39.79, Avg 48.2%, GSM 2.20%, COPA 66%  (MoE helps all metrics)
#   h1_sel_reg_128:  PPL 41.71, Avg 47.3%, GSM 1.97%, COPA 65%  (regs help COPA)
#   V1+R128:         PPL 46.41, Avg 45.5%, GSM 2.43%, COPA 62%  (regs help GSM for pure EGPT)
datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path: /proj/dmfexp/nima/.cache/megatron
      data_path:
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
      split: 99.5,0.5,0
      sequence_length: 4096
tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken
model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: register_energy
    n_registers: 128
    register_start_layer: 6    # registers injected only at the EGPT block (EGPT-only selective)
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations: [1, 1, 1, 1, 1, 1, 6]
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 768
    num_layers: 7
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: dual_unconstrained
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
      - &sa {sequence_mixer_type: softmax_attention, num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
      - *sa
      - *sa
      - *sa
      - *sa
      - *sa
      - sequence_mixer_type: energy_attention
        num_attention_heads: 12
        num_key_value_heads: 12
        add_bias: false
        attention_multiplier: 0.125
    mlp_blocks:
      - &gm {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
      - *gm
      - *gm
      - *gm
      - *gm
      - *gm
      - mlp_type: TopK_Energy_MoE_MLP
        intermediate_size: 2048
        n_experts: 4
        top_k: 2
        load_balance_coef: 0.01
        dropout: 0.0
        add_bias: false
tuning_args:
  tuning_method: pretraining
save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/energy-inference/results/multi-block-ablation/h1_topk_egpt_moe_r128_d768
  save_interval: 5000
  max_to_keep: 2
logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: energy-inference-large
    name: h1_topk_egpt_moe_r128_d768
training_parameters:
  num_training_steps: 30000
  eval_interval: 5000
  micro_batch_size: 4
  gradient_accumulation_steps: 4
  eval_during_training: false
  gradient_clipping: 1
optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 2.0e-3
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-8
lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000
  num_constant_steps: 0
  num_decay_steps: 28000
mixed_precision_args:
  dtype: bf16
distributed_args:
  fsdp_algorithm: 2
  torch_compile: true
  stage: 0
