    mlp_blocks:
      - &gpt_moe {mlp_type: MoE, activation_function: swiglu, intermediate_size: 256, num_experts: 128, num_experts_per_tok: 8, normalized_topk: true, shared_intermediate_size: 1024, use_interleaved_weights: false, shared_expert_gating: false, add_bias: false}
