      - *gpt_moe
      - *gpt_moe
      - *gpt_moe
      - *gpt_moe
      - mlp_type: BoltzmannMoE_Energy_MLP
        intermediate_size: 32768
        n_experts: 128
        temperature: 1.0
        repulsion_coef: 0.1
        n_repulsion_pairs: 4
        gelu_grad_method: sigmoid
        dropout: 0.0
        add_bias: false
      - mlp_type: BoltzmannMoE_Energy_MLP
        intermediate_size: 32768
