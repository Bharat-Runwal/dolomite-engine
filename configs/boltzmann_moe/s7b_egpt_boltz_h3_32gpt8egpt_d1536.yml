tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /proj/dmfexp/energy-gpt/checkpoints-bsaha/boltzmann_sweep/s7b_egpt_boltz_h3_32gpt8egpt_d1536
  save_interval: 1000

logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: dolomite
    name: s7b_egpt_boltz_h3_32gpt8egpt_d1536

training_parameters:
  num_training_steps: 124000
  eval_interval: 10000
  micro_batch_size: 4
  gradient_accumulation_steps: 4
  eval_during_training: false
  gradient_clipping: 1

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 3e-4
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-8

lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000
  num_constant_steps: 0
  num_decay_steps: 122000

mixed_precision_args:
  dtype: bf16

distributed_args:
  fsdp_algorithm: 2
  gradient_checkpointing_method: block
  torch_compile: false
  stage: 0

load_args:
