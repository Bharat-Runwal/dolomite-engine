# h1_egpt_d768: NON-MOE counterpart of h1_boltz_moe_fullsize.
# Same hybrid architecture (6 GPT + 1 EGPT × 6 recurrent), but the EGPT block
# uses a single Energy_MLP at intermediate=8192 instead of BoltzmannMoE_Energy_MLP
# with K=4 × I_e=2048. Since 1×Energy_MLP(I=8192) and 4×Energy_MLP(I=2048) have
# identical params and FLOPs, this isolates the contribution of MoE routing
# itself (vs. just having 8192 intermediate units).
#
# Comparison story:
#   h1_egpt              : 1 × Energy_MLP(I=8192)  ← this config
#   h1_boltz_fullsize    : Boltzmann MoE  K=4 × I_e=2048 (soft, all experts active)
#   h1_boltz_topk2       : Boltzmann MoE  K=4 × I_e=2048, top-2 sparse
#   h1_topk_egpt_moe     : TopK MoE       K=4 × I_e=2048, top-2 (learned router)
# Same total params (~145M), same FFN:Attn balance (~2.1×).

datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path: /proj/dmfexp/nima/.cache/megatron
      data_path:
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
      split: 99.5,0.5,0
      sequence_length: 4096

tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken

model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: energy
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations: [1, 1, 1, 1, 1, 1, 6]
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 768
    num_layers: 7
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: dual_unconstrained
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
      - &gpt_attn {sequence_mixer_type: softmax_attention, num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - sequence_mixer_type: energy_attention
        num_attention_heads: 12
        num_key_value_heads: 12
        add_bias: false
        attention_multiplier: 0.125
    mlp_blocks:
      - &gpt_ffn {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      # Single Energy_MLP at the same total intermediate as the 4-expert MoE (8192).
      # Same params, same compute as h1_boltz_fullsize / h1_boltz_topk2 / h1_topk_egpt_moe.
      - mlp_type: Energy_MLP
        intermediate_size: 8192
        add_bias: false

tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/boltzmann-moe/results/h1_egpt_d768
  save_interval: 3000
  max_to_keep: 2

logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: energy-inference-large
    name: h1_egpt_d768

training_parameters:
  num_training_steps: 30000
  eval_interval: 5000
  micro_batch_size: 4
  gradient_accumulation_steps: 4
  eval_during_training: false
  gradient_clipping: 1

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 2e-3
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-8

lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000
  num_constant_steps: 0
  num_decay_steps: 28000

mixed_precision_args:
  dtype: bf16

distributed_args:
  fsdp_algorithm: 2
  torch_compile: true
  stage: 0
