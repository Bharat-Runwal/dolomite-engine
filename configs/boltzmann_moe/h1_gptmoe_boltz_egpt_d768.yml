# h1_gptmoe_boltz_egpt: Switch/Mixtral MoE in GPT prefix + BoltzmannMoE in EGPT block
#
# Architecture:
#   Layers 1-6: softmax_attention + Switch MoE FFN (4 experts, top-2, load-balance)
#   Layer 7:    energy_attention  + BoltzmannMoE_Energy_MLP (×6 recurrent, full-size)
#
# GPT prefix MoE: standard Switch Transformer routing (learned linear gate, sparse top-2)
#   Each GPT expert: int=2048 (same as baseline MLP) — no param increase, routing adds diversity
#
# EGPT MoE: BoltzmannMoE with full-size experts (4 × 2048 = 8192 total)
#   Energy-based routing: E_i = h · term1_i, p_i = softmax(E_i/τ)
#   repulsion λ=0.1 for load balance
#
# Hypothesis: Switch MoE in GPT layers builds more specialised representations
# that feed a stronger routing signal into the BoltzmannMoE EGPT block.
# The GPT Switch MoE experts specialise on different token types;
# the EGPT BoltzmannMoE then routes based on energy alignment with those representations.

datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path: /proj/dmfexp/nima/.cache/megatron
      data_path:
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
      split: 99.5,0.5,0
      sequence_length: 4096

tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken

model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: energy
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations: [1, 1, 1, 1, 1, 1, 6]
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 768
    num_layers: 7
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: dual_unconstrained
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
      - &gpt_attn {sequence_mixer_type: softmax_attention, num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - sequence_mixer_type: energy_attention
        num_attention_heads: 12
        num_key_value_heads: 12
        add_bias: false
        attention_multiplier: 0.125
    mlp_blocks:
      # GPT prefix: Switch/Mixtral-style MoE (4 experts, top-2, load-balance loss)
      # Each expert is full-size int=2048 — same capacity as baseline MLP, just routed
      - &gpt_moe {mlp_type: MoE, activation_function: swiglu, intermediate_size: 2048,
                  num_experts: 4, num_experts_per_tok: 2, normalized_topk: true,
                  shared_intermediate_size: null, use_interleaved_weights: false,
                  shared_expert_gating: false, add_bias: false}
      - *gpt_moe
      - *gpt_moe
      - *gpt_moe
      - *gpt_moe
      - *gpt_moe
      # EGPT block: full-size BoltzmannMoE (4 × 2048 = 8192 total)
      - mlp_type: BoltzmannMoE_Energy_MLP
        intermediate_size: 8192
        n_experts: 4
        temperature: 1.0
        repulsion_coef: 0.1
        n_repulsion_pairs: 4
        dropout: 0.0
        add_bias: false

tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/energy-inference/results/multi-block-ablation/h1_gptmoe_boltz_egpt_d768
  save_interval: 5000
  max_to_keep: 2

logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: energy-inference-large
    name: h1_gptmoe_boltz_egpt_d768

training_parameters:
  num_training_steps: 30000
  eval_interval: 5000
  micro_batch_size: 4
  gradient_accumulation_steps: 4
  eval_during_training: false
  gradient_clipping: 1

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 2e-3
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-8

lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000
  num_constant_steps: 0
  num_decay_steps: 28000

mixed_precision_args:
  dtype: bf16

distributed_args:
  fsdp_algorithm: 2
  torch_compile: true
  stage: 0
