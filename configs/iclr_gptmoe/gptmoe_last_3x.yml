# PURE GPT + STANDARD MoE BASELINE (2026-09-13). No energy anything:
# softmax_attention everywhere, standard Switch-style MoE FFN, NO recurrence
# (layer_iterations all 1).
#
# WHY THIS WAS MISSING. Every 'learned router' arm so far still sat on an ENERGY
# backbone: iclr_learn_K16_top2 and iclr_pure_learn_isoP use TopK_Energy_MoE_MLP,
# whose experts compute an energy GRADIENT, not a standard FFN, and both keep an
# energy_attention block run 6-8x. Even the Switch arms sit on energy_attention with
# 6x recurrence. So we had no plain GPT-MoE reference point at all, and could not say
# whether the whole family is competitive with an ordinary MoE transformer.
#
# PARAM MATCHING. A standard SwiGLU expert has THREE d x I_e matrices; a Hopfield
# energy expert has ONE. So iso-parameter at K=16 forces I_e = 341 (16*3*768*341 =
# 12.57M, matching the energy MoE's 12.58M) -- narrow experts. The _3x variant
# instead keeps I_e = 1024 and is 3x the MoE budget, i.e. a deliberately STRONGER
# baseline (the user asked to match total params 'or even go larger').
# THIS ARM: MoE in the last layer only, I_e=1024 => 3x the MoE parameter budget.
# A deliberately stronger-than-iso baseline.
# iclr_hop_K16_top2
#
# energy router, HOPFIELD experts (single W -> 2x experts at iso-param), K=16, top-2 (k/K=0.125)
#
# FLOPS-frontier wave (2026-09-12). Backbone FIXED across ALL arms:
#   d=768, 7 blocks, layer_iterations [1,1,1,1,1,1,6], 12 heads, GPT ffn 2048,
#   30000 steps = 7.86B tokens, lr 2e-3 cosine. ONLY the MoE block differs.
# Iso-total-params in the MoE block (12.58M): w1w2 and the learned-router
#   class use 2*I_tot*d, hopfield uses I_tot*d, so hopfield carries 2x the
#   experts for the same parameters -> half the k/K at equal top_k.
# Question: quality vs k/K frontier against a learned-router MoE at each K.
#
# h1_boltz_moe_fullsize: direct BoltzmannMoE equivalent of h1_topk_egpt_moe
# Architecture identical to h1_topk; only the EGPT FFN routing differs:
#   h1_topk:            TopK_Energy_MoE_MLP  (sparse, learned linear router, load-balance loss)
#   h1_boltz_fullsize:  BoltzmannMoE_Energy_MLP (soft Boltzmann routing, energy-based router)
#
# KEY FIX vs h1_boltz_egpt_moe (existing): full-size experts, NOT iso-param.
#   OLD (iso-param): intermediate_size=2048 total → 4×512 per expert (tiny, same fail as B-series)
#   NEW (full-size): intermediate_size=8192 total → 4×2048 per expert (matches h1_topk capacity)
#
# This isolates routing mechanism (Boltzmann vs TopK) from expert capacity.
# Paired with repulsion λ=0.1 (best from B4) to discourage load collapse.
#
# Layers 1-6: softmax_attention + standard MLP (int=2048) — GPT prefix
# Layer 7:    energy_attention  + BoltzmannMoE_Energy_MLP (×6 recurrent)
#               4 experts × 2048 per expert = 8192 total intermediate
#
# Param count: ~145M (same order as h1_topk ~145M)

datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path: /proj/dmfexp/nima/.cache/megatron
      data_path:
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
      split: 99.5,0.5,0
      sequence_length: 4096

tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken

model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: energy
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations: [1, 1, 1, 1, 1, 1, 1]
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 768
    num_layers: 7
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: dual_unconstrained
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
      - &gpt_attn {sequence_mixer_type: softmax_attention, num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
    mlp_blocks:
      - &gpt_ffn {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - mlp_type: MoE
        activation_function: swiglu
        intermediate_size: 1024   # PER EXPERT
        num_experts: 16
        num_experts_per_tok: 2
        normalized_topk: true
        add_bias: false

tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/boltzmann-moe/results/iclr_gptmoe/gptmoe_last_3x
  save_interval: 1000   # 2026-09-14: was 5000. On preemptable these arms were preempted
                     # before ever reaching 5000, so they NEVER checkpointed and every
                     # resubmit restarted from step 0 -- 28 submissions, zero net progress.
  max_to_keep: 2

# NOTE 2026-09-14: the wandb name was wrong here. These configs were created by
# copying a parent config; only save_path was updated, so every derived arm logged to
# wandb under the PARENT's name and collided there. Local results under save_path were
# always correct (that is what the reported numbers come from), but the wandb view was
# missing or merged. wandb name must equal the config basename.
logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: energy-inference-large
    name: gptmoe_last_3x

training_parameters:
  num_training_steps: 30000
  eval_interval: 5000
  micro_batch_size: 4
  gradient_accumulation_steps: 4
  eval_during_training: false
  gradient_clipping: 1

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 2e-3
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-8

lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000
  num_constant_steps: 0
  num_decay_steps: 28000

mixed_precision_args:
  dtype: bf16

distributed_args:
  fsdp_algorithm: 2
  torch_compile: true
  stage: 0
