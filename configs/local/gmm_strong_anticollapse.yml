# Experiment B: No det norm + 10x stronger anti-collapse
# Changes vs baseline:
#   - use_det_normalization: false
#   - entropy_bonus_gamma: 1.0 (was 0.1)
#   - mixing_entropy_gamma: 1.0 (was 0.1)
#   - centroid_repulsion_lambda: 0.1 (was 0.01)
#   - diversity_lambda: 0.1 (was 0.01)

datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path: data/cache
      data_path:
        - data/wikitext2/wikitext2_text
      split: 95,5,0
      sequence_length: 1024

tokenizer_args:
  tokenizer_name: gpt2

model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    initializer_range: 0.02
    layer_norm_epsilon: 1e-05
    model_type: energy
    normalization_function: rmsnorm
    position_embedding_type: rope
    hidden_size: 512
    num_layers: 3
    init_method: normal
    tie_word_embeddings: true

    rope_dim: 64
    num_pre_layers: 1
    num_post_layers: 1
    num_iterations: 4

    router_aux_loss_coef: 0.001

    bos_token_id: 50256
    eos_token_id: 50256
    pad_token_id: 50256
    vocab_size: 50257
    max_position_embeddings: 1024

    sequence_mixer_blocks:
      - add_bias: false
        attention_multiplier: 0.125
        num_attention_heads: 8
        num_key_value_heads: 8
        sequence_mixer_type: softmax_attention
      - sequence_mixer_type: energy_attention
        num_attention_heads: 8
        num_key_value_heads: 8
        add_bias: false
        attention_multiplier: 0.125
      - add_bias: false
        attention_multiplier: 0.125
        num_attention_heads: 8
        num_key_value_heads: 8
        sequence_mixer_type: softmax_attention

    mlp_blocks:
      - activation_function: swiglu
        add_bias: false
        intermediate_size: 256
        mlp_type: MLP
      - mlp_type: GaussianBoltzmannMoE
        intermediate_size: 256
        add_bias: false
        num_experts: 8
        num_experts_per_tok: 2
        normalized_topk: true
        use_det_normalization: false        # <-- DISABLED
        use_mixing_coefficients: true
        diversity_lambda: 0.1               # <-- 10x (was 0.01)
        entropy_bonus_gamma: 1.0            # <-- 10x (was 0.1)
        mixing_entropy_gamma: 1.0           # <-- 10x (was 0.1)
        centroid_repulsion_lambda: 0.1      # <-- 10x (was 0.01)
        bias_based_balancing: true
        bias_update_alpha: 0.001
        kl_distillation: true
        distillation_weight: 0.01
        use_gmm_at_inference: false
      - activation_function: swiglu
        add_bias: false
        intermediate_size: 256
        mlp_type: MLP

tuning_args:
  tuning_method: pretraining

save_args:
  save_path: checkpoints/gmm_strong_anticollapse
  save_interval: 5000

logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: gmm-local-test
    name: gmm_strong_anticollapse
    entity: nima-dehmamy-projects

training_parameters:
  num_training_steps: 1000
  eval_interval: 250
  micro_batch_size: 4
  gradient_accumulation_steps: 2
  eval_during_training: false
  gradient_clipping: 1

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 3e-4
    weight_decay: 0.1
    betas:
      - 0.9
      - 0.95
    eps: 1e-10

lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 100
  num_constant_steps: 0
  num_decay_steps: 900

mixed_precision_args:
  dtype: bf16

distributed_args:
  fsdp_algorithm: 2
  torch_compile: false
  stage: 0
