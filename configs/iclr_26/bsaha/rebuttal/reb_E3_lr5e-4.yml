# ICLR27 rebuttal run reb_E3_lr5e-4 (base: fwe_sweep/fineweb_E3_switch_K8.yml; lr=5e-4 mbs=4 ga=4 on 8 GPUs)
# E3: Switch MoE 6G1x6S K=8 k=2. Iso-total with E1/E2. The learned-gate baseline.
datasets:
- class_name: MegatronDataset
  data_name: Megatron
  data_sampling_ratio: 1
  class_args:
    eval_steps: 2
    data_cache_path: /proj/dmfexp/energy-gpt/.cache/megatron_fwe_nemotron_bsaha
    data_path:
    - 1.0
    - /proj/dmfexp/datasets-shared/granite-4-cmix-FULL/web-nemotron-cc-hq-p2_0
    split: 99,0.5,0.5
    sequence_length: 4096
tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken
model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: energy
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations: [1,1,1,1,1,1,6]
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 768
    num_layers: 7
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: psd_anti
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
    - &gpt_attn {sequence_mixer_type: softmax_attention, num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
    - *gpt_attn
    - *gpt_attn
    - *gpt_attn
    - *gpt_attn
    - *gpt_attn
    - sequence_mixer_type: softmax_attention
      num_attention_heads: 12
      num_key_value_heads: 12
      add_bias: false
      attention_multiplier: 0.125
    mlp_blocks:
    - &gpt_ffn {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
    - *gpt_ffn
    - *gpt_ffn
    - *gpt_ffn
    - *gpt_ffn
    - *gpt_ffn
    - mlp_type: MoE
      intermediate_size: 2240
      num_experts: 8
      num_experts_per_tok: 2
      activation_function: swiglu
      normalized_topk: true
      shared_expert_gating: false
      use_interleaved_weights: false
      add_bias: false
tuning_args:
  tuning_method: pretraining
save_args:
  save_path: /proj/dmfexp/energy-gpt/checkpoints-bsaha/rebuttal/reb_E3_lr5e-4
  save_interval: 1000
  max_to_keep: 2
logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: boltzmann-moe-fwe
    name: reb_E3_lr5e-4
training_parameters:
  num_training_steps: 7629
  # LAUNCH: 8 GPUs (mbs 4 x ga 4), tok/step=524288, total=4.00B tokens
  eval_interval: 2000
  micro_batch_size: 4
  gradient_accumulation_steps: 4
  eval_during_training: false
  gradient_clipping: 1
optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 5e-4
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-08
lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 500
  num_constant_steps: 0
  num_decay_steps: 7129
mixed_precision_args:
  dtype: bf16
distributed_args:
  fsdp_algorithm: 2
  gradient_checkpointing_method: block
  torch_compile: true
  stage: 0
