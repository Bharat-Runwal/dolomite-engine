      intermediate_size: 4096
      add_bias: false
    - mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 4096
      add_bias: false
    - mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 4096
      add_bias: false
    - mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 4096
      add_bias: false
    - mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 4096
      add_bias: false
    - mlp_type: EnergyFF_BoltzmannMoE
      expert_kind: hopfield
      intermediate_size: 92000
      n_experts: 32
      top_k: 2
      hopfield_grad_scale: sqrt_consistent
      routing_norm: zscore
      temperature: 1.0
      repulsion_form: abs
      repulsion_coef: 0.1
      repulsion_space: output
      cos_probe_interval: 100
      n_repulsion_pairs: 4
      gelu_grad_method: sigmoid
