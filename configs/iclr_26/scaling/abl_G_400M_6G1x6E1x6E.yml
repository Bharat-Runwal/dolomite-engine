# ABLATION G -- TWO recurrent energy blocks: 6 GPT + 2 energy blocks each applied 6x.
# 12 energy applications per token against the current hybrid's 6, at matched TOTAL parameters.
# I_total = 92,000 per block (K=32, I_e=2,875), chosen so total = 399.785M vs the 400M hybrid's
# 399.784M (+0.000%). Active 223.145M vs the hybrid's 219.427M (+1.7%).
# WARNING -- NOT iso-FLOP with the hybrid: FLOPwt 321.685M vs 299.376M (+7.5%), because doubling
# the number of recurrent blocks doubles the applications. Read it against abl_G_400M_6G1x6S1x6S
# (its FLOP-matched learned-gate twin, 324.670M, +0.93%), not against the 1-block hybrid.
# sinkhorn_mu_iters = 6 = this block's layer_iterations entry (pre-flight rule 9).
# *** INTENDED GPU COUNT: 8 ***  mbs 2 x ga 8 x 4096 x 8 = 524,288 tok/step; 61,035 steps = 32.0B
datasets:
- class_name: MegatronDataset
  data_name: Megatron
  data_sampling_ratio: 1
  class_args:
    eval_steps: 2
    data_cache_path: /proj/dmfexp/nima/.cache/megatron_cmix
    data_path:
    - 0.35
    - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
    - 0.35
    - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
    - 0.15
    - /proj/datasets/granite-4-datasets-megatron-merged/megamath-web-pro_0
    - 0.15
    - /proj/datasets/granite-4-datasets-megatron-merged/finemath-3plus-rewritten_0
    split: 99,0.5,0.5
    sequence_length: 4096
tokenizer_args:
