# 4-GPU SINGLE-NODE SIBLING of abl_G_400M_6G1x6E1x6E. IDENTICAL budget, identical model, identical
# save_path -- it RESUMES THE SAME RUN. Only mbs/ga/GPU-count differ:
#     8 GPUs x mbs 2 x ga  8 x 4096 = 524,288   (the 8-GPU parent)
#     4 GPUs x mbs 2 x ga 16 x 4096 = 524,288   (this file)
# Gradient accumulation is mathematically equivalent at a fixed global batch, and mbs is unchanged
# so per-GPU activation memory is unchanged.
#
# WHY IT EXISTS. The parent must run SINGLE-NODE: it carries sinkhorn_persist_mu: true in BOTH of its
# recurrent energy blocks, and persist_mu's data-dependent .item() inside the compiled region wedges
# on multi-node (HANDOFF 14.4). Job 1798098 confirmed it at 2 nodes x 4 -- compiled fine, then went
# CPU-flat at 0 steps for 34 minutes with LSF still reporting RUN. But 1 node x 8 will not SCHEDULE:
# job 1798342 sat PEND 25 min with
#     Resource (ngpus_physical) limit ... has been reached: 493 hosts
# because almost no host has 8 free GPUs. Four free GPUs on one host is a far easier ask, and this is
# ABLATIONS.md section 5 option (b). Cost is roughly 2x the step time.
#
# *** INTENDED GPU COUNT: 4 ***  61,035 steps x 524,288 = 32.0B
datasets:
- class_name: MegatronDataset
  data_name: Megatron
  data_sampling_ratio: 1
  class_args:
    eval_steps: 2
    data_cache_path: /proj/dmfexp/nima/.cache/megatron_cmix
