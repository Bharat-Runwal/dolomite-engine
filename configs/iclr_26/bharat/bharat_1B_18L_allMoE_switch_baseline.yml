# ★ MAIN SUGGESTION baseline -- the learned-gate twin of bharat_1B_18L_allMoE_boltz.
# Identical in every respect except the FFN router: Switch MoE (learned gate) instead of the
# Boltzmann energy log-partition. Softmax attention everywhere in both, so the router is the ONLY
# difference -- this is the experiment.
# I_s = I_e/3 = 256 because swiglu stores THREE matrices per expert and hopfield stores ONE, so this
# is what makes the two iso-parameter at the same K and k.
# *** INTENDED GPU COUNT: 8 ***  524,288 tok/step; 61,035 steps = 32.0B.
