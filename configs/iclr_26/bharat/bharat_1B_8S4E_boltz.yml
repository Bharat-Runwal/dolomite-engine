# 1B BoltzMoE for Bharat -- 8S4E: 8 softmax+Switch-MoE layers, then 4 energy+BoltzmannMoE layers.
# NOT a copy of s8e4_stdmoe_fh2_boltz_topk2.yml. Built from OUR cmix1B skeleton + the PROVEN 400M
# hybrid energy block (configs/cmix/cmix_400M_hybrid_sparse.yml), so every routing knob is one we
# have actually trained: hopfield experts, e_sign_override pos, sinkhorn_iters 3, sparse_forward with
# the rank-16 subspace PROXY, repulsion output+subsample, renormalize_topk.
#
# WHY K=32 k=8 AND NOT K=8 or K=64 k=2.
#   * Our existing 1B (cmix1B_12L_gptDense_32B) is K=64 k=2: it stores a 746.1M expert bank and
#     activates 23.3M of it -- 3.1%. Total 1002.1M but ACTIVE only 279.3M, just +27% over the 400M
#     arms' 220M. That is exactly why it scores 47.79 and LOSES to the 400M FLOP-matched Switch
#     (48.24). A 1B that activates like a 400M performs like a 400M.
#   * K=8 (the colleague's setting) gives too few experts to route among at this width.
#   * K=32 k=8 activates 25% of the bank. ACTIVE = 364.0M = 1.66x the 400M arms.
#   * I_e = 96000/32 = 3000, close to the 400M hybrid's proven I_e=5871 and far above the 134M
#     arm's I_e=1024 which was flagged as too narrow for sparsity to pay.
#
# SCHEDULE IS COSINE over the full run, deliberately. We have NO controlled WSD-vs-cosine A/B at
# 32B; the WSD design was confirmed only on short probes (HANDOFF 12.17-12.18). Cosine is standard
# and is what the whole 134M tier used. The BASELINE uses the identical schedule -- that matching is
# what matters, not which shape.
#
# *** INTENDED GPU COUNT: 8 ***  mbs 2 x ga 8 x 4096 x 8 = 524,288 tok/step; 61,035 steps = 32.0B.
# For a 128B-token run multiply num_training_steps by 4 (244,140) and set num_decay_steps to match.
#
# sparse_candidates=10 / sparse_explore=2 -> p = 12 of K=32. The assert
# `top_k <= p <= n_experts` REJECTED the inherited sparse_candidates: 2, which was written for a
# top_k=2 arm -- a good catch by the code, and a reminder that top_k and the candidate count move
# together.
#
# THE TENSION THIS EXPOSES, AND IT IS A REAL DESIGN CONSTRAINT AT 1B. active_bank = (k/K) x bank,
# and bank cannot exceed ~700M inside a 1B budget. So high ACTIVE parameters force high k/K, which
# is exactly what shrinks the sparsity win: at k=8,p=12 of K=32 the ceiling on expert-compute saving
# is K/p = 2.7x, against 8x for the 400M hybrid's p=4 of 32. Our existing 1B sits at the opposite
# extreme -- k/K = 3.1%, superb sparsity, and it performs like a 400M model because it activates
# like one. This config picks the middle: 25% activation, 2.7x sparsity ceiling, 1.66x the 400M
# arms' active parameters. If Bharat has GPUs to spare, k=16 (50% activation) would reach 2.0x
# active but forfeit most of the sparsity story.
