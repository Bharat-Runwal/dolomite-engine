# ★ MAIN SUGGESTION for Bharat -- 1B, ALL 18 FFNs are a Boltzmann MoE, d=1536.
# Softmax attention in EVERY block, so the ONLY difference from the baseline is the ROUTER:
# energy log-partition selection vs a learned Switch gate. That is the comparison an MoE reviewer
# asks for, and none of our existing arms provide it cleanly.
#
# BUILT TO MATCH REAL MoE PRACTICE, verified from the models' own config.json:
#   OLMoE-1B-7B        16 layers, d=2048, ALL 16 MoE, K=64 k=8, I_e=1024  -> k*I_e = 4.0x d
#   Qwen1.5-MoE-A2.7B  24 layers, d=2048, ALL 24 MoE, K=60 k=4, I_e=1408  -> k*I_e = 2.8x d
# The field puts an MoE in EVERY layer and keeps the EFFECTIVE per-token FFN width k*I_e near 4x d,
# i.e. the width a dense model's FFN would have. This config: k*I_e = 8*768 = 6144 = 4.0x d.
#
# WHY NOT OUR USUAL SHAPE. Our arms invert the field's design: very FEW MoE layers, each absurdly
# wide. The 400M hybrid is 1 MoE block of 7 at k*I_e = 11.5x d; the fallback 8S4E is 23x d. And our
# existing 1B (K=64 k=2, 4 of 12 layers) activates only 3.1% of its 746M bank -- 279M active, just
# +27% over the 400M arms -- which is why it scores 47.79 and LOSES to abl_B_400M's 48.24.
# NOTE this also retires an earlier worry of ours that I_e=1024 is "too narrow for sparsity to pay":
# OLMoE uses exactly I_e=1024 and works, because k=8 and K=64 make k*I_e right. Narrow experts are
# fine; what matters is k*I_e.
#
# d=1536 with 24 heads -> head_dim 64 == rope_dim 64 (required: head_dim >= rope_dim).
# d=2048 would be more standard but our vocab is 100,352 -- 3x TinyLlama's -- so the tied embedding
# alone costs 205.5M there and total would pass 1.5B.
#
# COSINE over the full run. We have no controlled WSD-vs-cosine A/B at 32B. What matters is that the
# PAIR shares one schedule, which it does.
# hopfield experts + rank-16 subspace PROXY selection: measured 1.5x faster than the surrogate head
# (0.20 vs 0.30 s/step at 134M) with a quality gap inside noise.
# sparse_candidates = k+2 = 10, +2 explore -> p = 12 of K=32; sparsity ceiling K/p = 2.7x.
#
# *** INTENDED GPU COUNT: 8 ***  mbs 2 x ga 8 x 4096 x 8 = 524,288 tok/step; 61,035 steps = 32.0B.
# For 128B tokens: num_training_steps 244,140 and num_decay_steps 242,140.
