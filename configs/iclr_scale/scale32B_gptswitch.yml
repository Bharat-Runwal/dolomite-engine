# 400M / 32B-TOKEN BASELINE (2026-09-14). Pure GPT + standard Switch MoE: softmax attention
# throughout, NO recurrence, NO energy component anywhere. The paired control for
# scale32B_boltz_hop, identical token budget and schedule.
#
# At 134M this comparison is Boltzmann 46.26 vs pure-GPT-MoE 46.04, i.e. Boltzmann ahead by
# +0.22pp at half the routing density. This pair tests whether that survives 4x the tokens
# and 3x the parameters -- the single most load-bearing claim in the paper.
# ACTUAL ARCHITECTURE (this file = d=1536 / ~400M baseline). Pure GPT + standard Switch MoE.
# The block that used to be here was copied from boltz_hop and WRONGLY described a
# hopfield/energy recurrent hybrid — this arm has NO energy component and NO recurrence.
# Corrected 2026-09-14.
#
#   Backbone: model_type=energy wrapper but architecturally pure GPT — hidden_size=1536,
#     num_layers=7, 16 heads, rope_dim=64, layer_iterations [1,1,1,1,1,1,1] (NO recurrence).
#   Attention (all 7 blocks): softmax_attention (no energy_attention anywhere).
#   MLP blocks 1-6: swiglu MLP, intermediate_size=4096.
#   MLP block 7:    standard Switch MoE (mlp_type=MoE, swiglu), num_experts=32,
#     num_experts_per_tok=2, normalized_topk=true, intermediate_size=426 PER expert
#     (param-matched to boltz_hop's 40960-total hopfield mixture). TRUE sparse dispatch:
#     only 2 of 32 experts run per token.
#   Training: identical budget/schedule to boltz_hop — 61,035 steps x 524,288 tok = 32.0B
#     tokens; lr 2e-3 cosine, warmup 2000, decay 59,035; bf16; FSDP2; gc=block.
#     torch_compile=FALSE (required: the standard MoE's data-dependent expert shapes cause
#     rank-dependent recompiles -- 19.7x slower + gloo crashes).
#
# MEASURED COST (16 GPU / 2 nodes, 2026-09-14): ~1.34 s/step, ~34 Btok/day -> 32B ~= 22 h.
#   ~5x faster per step than boltz_hop: only 2 of 32 experts run, and there is no recurrence.

datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path: /proj/dmfexp/nima/.cache/megatron
      data_path:
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
      split: 99.5,0.5,0
      sequence_length: 4096

tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken

model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: energy
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations: [1, 1, 1, 1, 1, 1, 1]
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 1536
    num_layers: 7
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: dual_unconstrained
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
      - &gpt_attn {sequence_mixer_type: softmax_attention, num_attention_heads: 16, num_key_value_heads: 16, add_bias: false, attention_multiplier: 0.125}
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
    mlp_blocks:
      - &gpt_ffn {mlp_type: MLP, activation_function: swiglu, intermediate_size: 4096, add_bias: false}
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      # Standard Switch MoE: 32 experts, top-2, TRUE sparse dispatch (only 2 experts run/token).
      - mlp_type: MoE
        activation_function: swiglu
        intermediate_size: 426   # PER EXPERT; 3 matrices/expert, so this
                                 # matches the 40960-total Hopfield mixture
        num_experts: 32
        num_experts_per_tok: 2
        normalized_topk: true
        add_bias: false

tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/boltzmann-moe/results/iclr_scale/scale32B_gptswitch
  save_interval: 1000
  max_to_keep: 40   # was 2. With save_interval 1000 that kept only ~2 checkpoints, so the switch
                 # arm had already deleted everything before step 32000 -- which would have
                 # made a MATCHED-TOKEN comparison impossible at any earlier step if the
                 # slower Boltzmann arm cannot reach 32B. 40 covers the whole run at 1000-step
                 # granularity for a ~5GB/ckpt model.

logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: energy-inference-large
    name: scale32B_gptswitch

training_parameters:
  num_training_steps: 61035   # 32B tokens at 524,288 tok/step (16 GPU, ga=8)
  eval_interval: 5000
  micro_batch_size: 1
  gradient_accumulation_steps: 8   # 16 GPU x mbs1 x ga8 x 4096 = 524,288 tok/step; x 61,035 steps = 32.0B
  eval_during_training: false
  gradient_clipping: 1

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 2e-3
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-8

lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000
  num_constant_steps: 0
  num_decay_steps: 59035

mixed_precision_args:
  dtype: bf16

distributed_args:
  fsdp_algorithm: 2
  # 400M at d=1536 does not fit without this; the earlier 400M tier OOM'd at
  # mbs=4 even at d=1024.
  gradient_checkpointing_method: block
  # REQUIRED false for the standard MoE class: data-dependent expert shapes cause
  # rank-dependent recompiles -- 19.7x slower plus gloo crashes.
  torch_compile: false
  stage: 0
