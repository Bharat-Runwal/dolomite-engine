# 400M / 32B-TOKEN BASELINE (2026-09-14). Pure GPT + standard Switch MoE: softmax attention
# throughout, NO recurrence, NO energy component anywhere. The paired control for
# scale32B_boltz_hop, identical token budget and schedule.
#
# At 134M this comparison is Boltzmann 46.26 vs pure-GPT-MoE 46.04, i.e. Boltzmann ahead by
# +0.22pp at half the routing density. This pair tests whether that survives 4x the tokens
# and 3x the parameters -- the single most load-bearing claim in the paper.
# 400M / 32B-TOKEN SCALE RUN (2026-09-14). The headline pair the paper needs.
#
# WHY THIS SHAPE. Our 134M grid is only 7.86B tokens -- enough to rank variants, nothing about
# scale -- and the earlier 400M pair ran just 3.93B tokens and came out inconclusive (ppl 62-69,
# three metrics disagreeing). This pair fixes both: 400M at 32B tokens, 4x the 134M grid's budget
# and 8x the old 400M pair's.
#
# ARCHITECTURE IS THE HYBRID, NOT THE PURELY RECURRENT DESIGN. The 400M pure single-block arm
# scored 42.70, and attribution showed the architecture causes that, not the router (~0.32 nats,
# ~7.5x the router effect, hitting both routers equally). Repeating it at 32B would spend two
# days confirming a known-bad design. So the Boltzmann arm is the hybrid -- GPT prefix plus one
# recurrent energy block -- the design that produced 46.26.
#
# EXPERT FORM IS HOPFIELD: our best measured sparse arm (46.26 at k/K=0.062 vs w1w2's 45.69 at
# 0.125). The w1w2 K=32 arm that would settle the form choice needs 7.2h more, past the window
# for starting this run.
#
# SCHEDULE: decay spans the FULL run. The slope arms were misconfigured with a decay length
# inherited from a 30k schedule, so their LR hit its floor at 30k and sat there for 60k steps.
# iclr_hop_K32_top2
#
# energy router, HOPFIELD experts (single W -> 2x experts at iso-param), K=32, top-2 (k/K=0.062)
#
# FLOPS-frontier wave (2026-09-12). Backbone FIXED across ALL arms:
#   d=768, 7 blocks, layer_iterations [1,1,1,1,1,1,6], 12 heads, GPT ffn 2048,
#   30000 steps = 7.86B tokens, lr 2e-3 cosine. ONLY the MoE block differs.
# Iso-total-params in the MoE block (12.58M): w1w2 and the learned-router
#   class use 2*I_tot*d, hopfield uses I_tot*d, so hopfield carries 2x the
#   experts for the same parameters -> half the k/K at equal top_k.
# Question: quality vs k/K frontier against a learned-router MoE at each K.
#
# h1_boltz_moe_fullsize: direct BoltzmannMoE equivalent of h1_topk_egpt_moe
# Architecture identical to h1_topk; only the EGPT FFN routing differs:
#   h1_topk:            TopK_Energy_MoE_MLP  (sparse, learned linear router, load-balance loss)
#   h1_boltz_fullsize:  BoltzmannMoE_Energy_MLP (soft Boltzmann routing, energy-based router)
#
# KEY FIX vs h1_boltz_egpt_moe (existing): full-size experts, NOT iso-param.
#   OLD (iso-param): intermediate_size=2048 total → 4×512 per expert (tiny, same fail as B-series)
#   NEW (full-size): intermediate_size=8192 total → 4×2048 per expert (matches h1_topk capacity)
#
# This isolates routing mechanism (Boltzmann vs TopK) from expert capacity.
# Paired with repulsion λ=0.1 (best from B4) to discourage load collapse.
#
# Layers 1-6: softmax_attention + standard MLP (int=2048) — GPT prefix
# Layer 7:    energy_attention  + BoltzmannMoE_Energy_MLP (×6 recurrent)
#               4 experts × 2048 per expert = 8192 total intermediate
#
# Param count: ~145M (same order as h1_topk ~145M)

datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path: /proj/dmfexp/nima/.cache/megatron
      data_path:
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
      split: 99.5,0.5,0
      sequence_length: 4096

tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken

model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: energy
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations: [1, 1, 1, 1, 1, 1, 1]
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 1536
    num_layers: 7
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: dual_unconstrained
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
      - &gpt_attn {sequence_mixer_type: softmax_attention, num_attention_heads: 16, num_key_value_heads: 16, add_bias: false, attention_multiplier: 0.125}
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
    mlp_blocks:
      - &gpt_ffn {mlp_type: MLP, activation_function: swiglu, intermediate_size: 4096, add_bias: false}
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      # Full-size BoltzmannMoE: 4 experts × 2048 each = 8192 total (matches h1_topk capacity)
      - mlp_type: MoE
        activation_function: swiglu
        intermediate_size: 426   # PER EXPERT; 3 matrices/expert, so this
                                 # matches the 40960-total Hopfield mixture
        num_experts: 32
        num_experts_per_tok: 2
        normalized_topk: true
        add_bias: false

tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/boltzmann-moe/results/iclr_scale/scale32B_gptswitch
  save_interval: 1000
  max_to_keep: 2

logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: energy-inference-large
    name: scale32B_gptswitch

training_parameters:
  num_training_steps: 61035   # 32B tokens at 524,288 tok/step (16 GPU, ga=8)
  eval_interval: 5000
  micro_batch_size: 1
  gradient_accumulation_steps: 8   # 16 GPU x mbs1 x ga8 x 4096 = 524,288 tok/step; x 61,035 steps = 32.0B
  eval_during_training: false
  gradient_clipping: 1

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 2e-3
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-8

lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000
  num_constant_steps: 0
  num_decay_steps: 59035

mixed_precision_args:
  dtype: bf16

distributed_args:
  fsdp_algorithm: 2
  # 400M at d=1536 does not fit without this; the earlier 400M tier OOM'd at
  # mbs=4 even at d=1024.
  gradient_checkpointing_method: block
  # REQUIRED false for the standard MoE class: data-dependent expert shapes cause
  # rank-dependent recompiles -- 19.7x slower plus gloo crashes.
  torch_compile: false
  stage: 0
