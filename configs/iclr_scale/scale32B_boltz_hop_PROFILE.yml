# PHASE-B PROFILER RUN — THROWAWAY. Derived from scale32B_boltz_hop.yml (2026-09-14).
#
# PURPOSE: measure the per-step wall-clock split of the Boltzmann arm — recurrence
# (block-7 x6) vs energy-attention vs the dense-MoE FFN — to confirm or refute the
# benchmark's INFERENCE that the ~5x boltz-vs-gptswitch gap is dominated by the 6x
# recurrence, not by MoE routing density. The MoE microbench (bench_moe_train_step_
# 20260914.py) put the MoE block at ~19.3ms fwd+bwd x 48 calls/step ~= 14% of a
# 6.75s step; this run captures a REAL torch.profiler trace to check that estimate
# against the actual recurrence + energy-attention cost.
#
# IT IS SAFE ALONGSIDE THE HEADLINE RUN (jobs 1647293 boltz_hop / 1647503 gptswitch):
#   - scratch save_path (NOT the headline results dir) + save_interval > total steps
#     (never writes a checkpoint),
#   - scratch wandb project/name,
#   - fresh random init (no load_args) — fine for a timing trace,
#   - 15 training steps only.
# It does NOT read, write, or resume any headline checkpoint. Run on 4 preemptable GPUs.
#
# The profiler (lm_engine/utils/profiler.py, TorchProfiler defaults wait=5/warmup=5/
# active=1) records exactly ONE step (the 11th) after 10 warmup steps, so torch.compile
# has settled by the captured step. num_training_steps=15 leaves margin. Trace lands in
# logging_args.torch_profiler_trace_path as a tensorboard_trace_handler .pt.trace.json.

datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path: /proj/dmfexp/nima/.cache/megatron
      data_path:
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
      split: 99.5,0.5,0
      sequence_length: 4096

tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken

model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: energy
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations: [1, 1, 1, 1, 1, 1, 6]
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 1536
    num_layers: 7
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: dual_unconstrained
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
      - &gpt_attn {sequence_mixer_type: softmax_attention, num_attention_heads: 16, num_key_value_heads: 16, add_bias: false, attention_multiplier: 0.125}
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - *gpt_attn
      - sequence_mixer_type: energy_attention
        num_attention_heads: 16
        num_key_value_heads: 16
        add_bias: false
        attention_multiplier: 0.125
    mlp_blocks:
      - &gpt_ffn {mlp_type: MLP, activation_function: swiglu, intermediate_size: 4096, add_bias: false}
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - *gpt_ffn
      - mlp_type: EnergyFF_BoltzmannMoE
        expert_kind: hopfield
        intermediate_size: 40960
        n_experts: 32
        top_k: 2
        hopfield_grad_scale: sqrt_consistent
        routing_norm: zscore
        temperature: 0.35
        repulsion_form: abs
        repulsion_coef: 0.1
        n_repulsion_pairs: 4
        gelu_grad_method: sigmoid
        activation_function: gelu
        add_bias: false

tuning_args:
  tuning_method: pretraining

save_args:
  # SCRATCH path + interval > total steps => never writes a checkpoint. NOT the headline dir.
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/boltzmann-moe/results/profiler/scale32B_boltz_hop_PROFILE_ckpt
  save_interval: 100000
  max_to_keep: 2

logging_args:
  log_interval: 5
  # THE PROFILER SWITCH: pretrain.py:388 reads this and wraps the training loop in
  # a torch.profiler that dumps a tensorboard trace here (one step, the 11th).
  torch_profiler_trace_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/boltzmann-moe/results/profiler/boltz_hop_trace
  experiments_tracker_name: wandb
  wandb_args:
    project: energy-profiling-scratch
    name: scale32B_boltz_hop_PROFILE

training_parameters:
  num_training_steps: 15
  eval_interval: 100000
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  eval_during_training: false
  gradient_clipping: 1

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 2e-3
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-8

lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2
  num_constant_steps: 0
  num_decay_steps: 13

mixed_precision_args:
  dtype: bf16

distributed_args:
  fsdp_algorithm: 2
  gradient_checkpointing_method: block
  torch_compile: true
  stage: 0
