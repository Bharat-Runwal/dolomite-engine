datasets:
  # class_name - data_name & data_sampling_ratio are not used but need to be passed to avoid errors
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path: /proj/checkpoints/bharat/cache
      data_path:
        - 1 # mixture ratio
        - /proj/checkpoints/shawntan/diffusion/release/data/dclm-dedup-gpt2-tokenized/dclm_00_text # path prefix
      split: 100,0,0
      sequence_length: 4096 # context length


tokenizer_args:
  tokenizer_name: /proj/checkpoints/shawntan/diffusion/release/data/tokenizer

kernel_args:
  kernels:
    - flash_attention_2

    # - swiglu_packed_cute
    # - rmsnorm_cute
    # - scattermoe

model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    initializer_range: 0.1
    layer_norm_epsilon: 1e-05
    model_type: energy
    normalization_function: bare_layernorm
    position_embedding_type: rope
    hidden_size: 2048
    # m_width: 8
    # m_emb: 12
    # m_residual: 0.28577380332470415
    num_layers: 2
    # init_method: mup
    init_method: normal
    rope_dim: 64
    tie_word_embeddings: true

    bos_token_id: 50256 # ensure these are same in the tokenizer
    eos_token_id: 50256
    pad_token_id: 50258
    vocab_size: 50259
    max_position_embeddings: 4096
    sequence_mixer_blocks:
      - sequence_mixer_type: energy_attention
        num_attention_heads: 16
        num_key_value_heads: 16
        add_bias: false
        attention_multiplier: 0.0078125
      - sequence_mixer_type: energy_attention
        num_attention_heads: 16
        num_key_value_heads: 16
        add_bias: false
        attention_multiplier: 0.0078125
    mlp_blocks:
      - mlp_type: Energy_MLP
        activation_function: swiglu
        intermediate_size: 4096
        add_bias: false
      - mlp_type: Energy_MLP
        activation_function: swiglu
        intermediate_size: 4096
        add_bias: false


  # use_padding_free_transformer: true
  # # efficient_initialization: true
  # reset_attention_mask: true
  # reset_position_ids: true

tuning_args:
  tuning_method: pretraining
  # tuning_method: pretraining_diffusion

save_args:
  save_path: /proj/checkpoints/bharat/personal/energy_gpt/energy-gpt_test
  save_interval: 5000

# TODO restoring from last checkpoint


logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: energy-gpt
    name: energy-gpt-test


training_parameters:
  num_training_steps: 75000
  eval_interval: 1000000000
  micro_batch_size: 2
  gradient_accumulation_steps: 4
  eval_during_training: false

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 0.01
    weight_decay: 0.1
    betas:
      - 0.9
      - 0.95
    eps: 1e-10

lr_scheduler_args:
  lr_decay_style: power
  num_warmup_steps: 5000
  num_constant_steps: 0
  num_decay_steps: 70000
  extra_lr_scheduler_args:
    # 4 * global_batch_size
    a: 4096
    # constant
    b: -0.51
    # global_batch_size in number of tokens
    c: 4194304

mixed_precision_args:
  dtype: bf16

distributed_args:
  fsdp_algorithm: 2
  torch_compile: false
  stage: 0
