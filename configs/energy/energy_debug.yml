# Debug config for single node interactive testing
# Usage: torchrun --nproc_per_node=8 -m lm_engine.pretrain configs/energy/energy_debug.yml

datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path: /proj/dmfexp/energy-gpt/cache
      data_path:
        - 1
        - /proj/dmfexp/energy-gpt/data/dclm-dedup-gpt2-tokenized/dclm_00_text
      split: 100,0,0
      sequence_length: 512  # short seq for debug

tokenizer_args:
  tokenizer_name: /proj/dmfexp/energy-gpt/data/tokenizer

kernel_args:
  kernels:
    - flash_attention_2

model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    initializer_range: 0.1
    layer_norm_epsilon: 1e-05
    model_type: energy
    normalization_function: bare_layernorm
    # position_embedding_type: rope
    position_embedding_type: nope
    hidden_size: 512       # small
    num_layers: 3          # fewer layers
    init_method: normal
    rope_dim: 32
    tie_word_embeddings: true

    num_pre_layers: 1
    num_post_layers: 1
    num_iterations: 2

    bos_token_id: 50256
    eos_token_id: 50256
    pad_token_id: 50258
    vocab_size: 50259
    max_position_embeddings: 512
    sequence_mixer_blocks:
      - add_bias: false
        attention_multiplier: 0.0625
        num_attention_heads: 8
        num_key_value_heads: 8
        sequence_mixer_type: softmax_attention
      - sequence_mixer_type: energy_attention
        num_attention_heads: 8
        num_key_value_heads: 8
        add_bias: false
        attention_multiplier: 0.03125
      - add_bias: false
        attention_multiplier: 0.0625
        num_attention_heads: 8
        num_key_value_heads: 8
        sequence_mixer_type: softmax_attention
    mlp_blocks:
      - activation_function: swiglu
        add_bias: false
        intermediate_size: 1024
        mlp_type: MLP
      - mlp_type: Energy_MLP
        activation_function: swiglu
        intermediate_size: 1024
        add_bias: false
      - activation_function: swiglu
        add_bias: false
        intermediate_size: 1024
        mlp_type: MLP

tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /proj/dmfexp/energy-gpt/checkpoints/energy-debug
  save_interval: 100

logging_args:
  log_interval: 1  # log every step for debug
  experiments_tracker_name: wandb
  wandb_args:
    project: dolomite
    name: energy-debug

training_parameters:
  num_training_steps: 5000
  eval_interval: 1000
  micro_batch_size: 2
  gradient_accumulation_steps: 1
  eval_during_training: false

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 0.001
    weight_decay: 0.1
    betas:
      - 0.9
      - 0.95
    eps: 1e-10

lr_scheduler_args:
  lr_decay_style: cosine
  num_warmup_steps: 10
  num_constant_steps: 0
  num_decay_steps: 40

mixed_precision_args:
  dtype: bf16

distributed_args:
  fsdp_algorithm: 2
  torch_compile: false
  stage: 0
