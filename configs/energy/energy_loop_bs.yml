datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path: /proj/checkpoints/bharat/cache
      data_path:

      split: 100,0,0
      sequence_length: 4096

tokenizer_args:
  tokenizer_name: /proj/checkpoints/dmf-lh-checkpoints/granite-4.0-tiktoken

model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    initializer_range: 0.02
    layer_norm_epsilon: 1e-05
    model_type: energy
    normalization_function: rmsnorm
    position_embedding_type: rope
    hidden_size: 768
    num_layers: 12
    init_method: normal
    tie_word_embeddings: true

    rope_dim: 64

    layer_iterations: []


    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096

    sequence_mixer_blocks:
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: energy_attention,  num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: energy_attention,  num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: energy_attention,  num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: energy_attention,  num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
    mlp_blocks:
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
      - {mlp_type: Energy_MLP, intermediate_size: 2048, add_bias: false}
      - {mlp_type: Energy_MLP, intermediate_size: 2048, add_bias: false}
      - {mlp_type: Energy_MLP, intermediate_size: 2048, add_bias: false}
      - {mlp_type: Energy_MLP, intermediate_size: 2048, add_bias: false}

tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /proj/checkpoints/bharat/personal/energy_gpt/new/egpt_12b_hybrid_softmax_energy_math
  save_interval: 5000

logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: energy-gpt
    name: egpt_12b_hybrid_softmax_energy_math

training_parameters:
  num_training_steps: 30000
  eval_interval: 1000000000
  eval_during_training: false
  micro_batch_size: 4
  gradient_accumulation_steps: 4
  gradient_clipping: 1

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 3e-4
    weight_decay: 0.1
    betas:
      - 0.9
      - 0.95
    eps: 1e-8

lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000
  num_constant_steps: 0
  num_decay_steps: 28000

mixed_precision_args:
  dtype: bf16

distributed_args:
  fsdp_algorithm: 2
  torch_compile: true
  stage: 0