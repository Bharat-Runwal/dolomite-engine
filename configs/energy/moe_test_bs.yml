# ============================================================
# MoE Base Config: 12-layer hybrid (s8_e4) — 160M active params
# ============================================================
# 8 softmax layers + 4 energy layers (3/4/6/9 iters)
# hidden=768, 12 heads, 32 experts × 640, top-2
# Sweep script patches mlp_type, attention type, and LR.

datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path: /proj/dmfexp/energy-gpt/cache-bsaha
      data_path:
        - 0.35
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
        - 0.35
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
        - 0.15
        - /proj/datasets/granite-4-datasets-megatron-merged/megamath-web-pro_0
        - 0.15
        - /proj/datasets/granite-4-datasets-megatron-merged/finemath-3plus-rewritten_0
      split: 99,0.5,0.5
      sequence_length: 4096

tokenizer_args:
  tokenizer_name: /proj/dmfexp/energy-gpt/data/granite-4.0-tiktoken

model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    initializer_range: 0.02
    layer_norm_epsilon: 1e-05
    model_type: energy
    normalization_function: rmsnorm
    position_embedding_type: rope
    hidden_size: 768
    num_layers: 12
    init_method: normal
    tie_word_embeddings: true

    rope_dim: 64

    # Hybrid: 8 softmax (1 iter) + 4 energy blocks (3/4/6/9 iters)
    layer_iterations: [1, 1, 1, 1, 1, 1, 1, 1, 3, 4, 6, 9]
    iter_dropout_range: [0, 0, 0, 0, 0, 0, 0, 0, 1, 2, 2, 4]
    proj_mode: unconstrained

    router_aux_loss_coef: 0.001

    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096

    sequence_mixer_blocks:
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: energy_attention, num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: energy_attention, num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: energy_attention, num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: energy_attention, num_attention_heads: 12, num_key_value_heads: 12, add_bias: false, attention_multiplier: 0.125}
    mlp_blocks:
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
      - {mlp_type: MoE_Energy_F5, intermediate_size: 640, add_bias: false, num_experts: 32, num_experts_per_tok: 2, normalized_topk: true, boltzmann_temperature: 1.0, learnable_temperature: true, distillation_weight: 0.01}
      - {mlp_type: MoE_Energy_F5, intermediate_size: 640, add_bias: false, num_experts: 32, num_experts_per_tok: 2, normalized_topk: true, boltzmann_temperature: 1.0, learnable_temperature: true, distillation_weight: 0.01}
      - {mlp_type: MoE_Energy_F5, intermediate_size: 640, add_bias: false, num_experts: 32, num_experts_per_tok: 2, normalized_topk: true, boltzmann_temperature: 1.0, learnable_temperature: true, distillation_weight: 0.01}
      - {mlp_type: MoE_Energy_F5, intermediate_size: 640, add_bias: false, num_experts: 32, num_experts_per_tok: 2, normalized_topk: true, boltzmann_temperature: 1.0, learnable_temperature: true, distillation_weight: 0.01}

tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /proj/dmfexp/energy-gpt/checkpoints-bsaha/moe_sweep
  save_interval: 2000

logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: dolomite
    name: moe_base

training_parameters:
  num_training_steps: 30000
  eval_interval: 10000
  micro_batch_size: 4
  gradient_accumulation_steps: 4
  gradient_clipping: 1

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 2e-3
    weight_decay: 0.1
    betas:
      - 0.9
      - 0.95
    eps: 1e-8

lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000
  num_constant_steps: 0
  num_decay_steps: 28000

mixed_precision_args:
  dtype: bf16

distributed_args:
  fsdp_algorithm: 2
  torch_compile: true
  stage: 0
