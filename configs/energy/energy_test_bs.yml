datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path: /proj/dmfexp/energy-gpt/cache-bsaha
      data_path:
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
      split: 99,0.5,0.5
      sequence_length: 4096

tokenizer_args:
  tokenizer_name: /proj/dmfexp/energy-gpt/data/granite-4.0-tiktoken

model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    initializer_range: 0.02
    layer_norm_epsilon: 1e-05
    model_type: energy
    normalization_function: rmsnorm
    position_embedding_type: rope
    hidden_size: 1024
    num_layers: 4
    init_method: normal
    tie_word_embeddings: true

    rope_dim: 128
    # 4 blocks: shallow-deep-deep-shallow
    layer_iterations: [4, 14, 14, 4]

    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096

    sequence_mixer_blocks:
      - {sequence_mixer_type: energy_attention, num_attention_heads: 8, num_key_value_heads: 8, add_bias: false, attention_multiplier: 0.08838}
      - {sequence_mixer_type: energy_attention, num_attention_heads: 8, num_key_value_heads: 8, add_bias: false, attention_multiplier: 0.08838}
      - {sequence_mixer_type: energy_attention, num_attention_heads: 8, num_key_value_heads: 8, add_bias: false, attention_multiplier: 0.08838}
      - {sequence_mixer_type: energy_attention, num_attention_heads: 8, num_key_value_heads: 8, add_bias: false, attention_multiplier: 0.08838}
    mlp_blocks:
      - {mlp_type: Energy_MLP, intermediate_size: 8192, add_bias: false}
      - {mlp_type: Energy_MLP, intermediate_size: 8192, add_bias: false}
      - {mlp_type: Energy_MLP, intermediate_size: 8192, add_bias: false}
      - {mlp_type: Energy_MLP, intermediate_size: 8192, add_bias: false}

tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /proj/dmfexp/energy-gpt/checkpoints-bsaha/egpt_test
  save_interval: 5000

logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: dolomite
    name: baseline_3EGPT_3iter

training_parameters:
  num_training_steps: 30000
  eval_interval: 5000
  micro_batch_size: 2 #4
  gradient_accumulation_steps: 4 #4
  gradient_clipping: 1

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 3e-4
    weight_decay: 0.1
    betas:
      - 0.9
      - 0.95
    eps: 1e-8

lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000
  num_constant_steps: 0
  num_decay_steps: 28000

mixed_precision_args:
  dtype: bf16

distributed_args:
  fsdp_algorithm: 2
  torch_compile: true
  stage: 0