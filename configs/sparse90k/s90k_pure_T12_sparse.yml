# SPARSE-TRAINED PURE T12 -- 2026-09-16. The real thing, not a probe.
#
# DESIGNED AS A PAIRED COMPARISON against the live dense t90k_pure_T12: IDENTICAL schedule
# (90000 steps, warmup 2000 + decay 88000), IDENTICAL 262144 tokens/step, identical model shape.
# Only the mixture computation differs. So the two loss curves are comparable STEP FOR STEP, which
# is what "is it going well?" needs -- and what an earlier attempt could not answer, because its
# compressed 100-step schedule had already decayed the LR while the dense arm was still in warmup.
#
# 8 GPUs x mbs 4 x ga 2 x 4096 = 262144, matching the dense arm's 4 x 4 x 4 x 4096. ONE node, so
# inside the range where fused_experts is validated (it wedges at 2 nodes).
#
# MEASURED BASIS: end-to-end 2.55x on 4 GPUs (0.6210 vs 1.5843 s/step at equal tokens/step),
# stable to +-0.3% over steps 20-100. At 8 GPUs this should finish in ~8 h against the dense
# arm's ~40 h.
#
# WHAT IS UNVERIFIED: quality. A sparse-TRAINED model has no approximation error -- the sparse
# computation IS the model -- but "no approximation" is not "same quality". Retrofitting sparsity
# onto the trained dense checkpoint cost -0.68pp Avg11, and the pure model is ~20x more
# routing-sensitive than a hybrid because its mixture runs at all 12 iterations. This run is the
# experiment that settles it. WATCH: train-lm_loss against t90k_pure_T12 at the same step, and
# expert_cos_abs_mean for the regulariser.
#
# mbs 4 is load-bearing: below ~16384 tokens/call the sparse path loses its advantage (1.36x at
# 4096). Dense+fused OOMs at mbs 4; sparse fits because it cuts the intermediate 6.4x.
# TOKEN-SCALING SET, 90000 steps = 23.6B tokens, CORRECTLY SCHEDULED (2026-09-16).
#
# WHY THIS EXISTS. The published slope90k_* arms set num_training_steps 90000 but
# num_warmup_steps 2000 + num_decay_steps 28000 = 30000, so their last 60000 steps ran pinned
# at the 2e-4 floor. Measured on the reruns: loss falls 0.12-0.15 per 10k steps while the LR
# decays, then -0.002..0.000 per 10k at the floor -- the final 45-51k steps bought 0.015-0.019
# nats. So there is currently NO sound token-scaling measurement, and the paper's
# "+0.41pp for 3x the tokens" is a lower bound rather than a result.
#
# Here decay covers the whole run: warmup 2000 + decay 88000 = 90000.
#
# One representative per family, all at 262144 tokens/step on 4 GPUs so the three are directly
# comparable to each other AND to the 30000-step (7.86B) arms of the same lineage:
#   hybrid boltz : iclr_hop_K32_top2_sink   Avg11 44.58, the best corrected hybrid
#   pure boltz   : pure_hop_T12_sink        Avg11 40.96, the best pure arm (12 iterations)
#   GPT switch   : gptmoe_last_isoP         Avg11 44.43, the paper's plain-GPT iso-param row
#                                           (NOT gptmoe_all_isoP, which is 43.05)
#
# Boltzmann arms carry sinkhorn_persist_mu + sinkhorn_mu_iters from the start, so mu reaches
# inference. Without it the router is trained tilted and evaluated untilted: +1.827 nats at 12
# iterations, +1.587 at 8, ~0.003 for a hybrid.
# THIS ARM: t90k_pure_T12  (base configs/iclr_sink/pure_hop_T12_sink.yml)

datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path: /proj/dmfexp/nima/.cache/megatron
      data_path:
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
      split: 99.5,0.5,0
      sequence_length: 4096

tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken

model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: energy
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations: [12]
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 768
    num_layers: 1
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: dual_unconstrained
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
      - sequence_mixer_type: energy_attention
        num_attention_heads: 12
        num_key_value_heads: 12
        add_bias: false
        attention_multiplier: 0.125
    mlp_blocks:
      # Full-size BoltzmannMoE: 4 experts × 2048 each = 8192 total (matches h1_topk capacity)
      - mlp_type: EnergyFF_BoltzmannMoE
        expert_kind: hopfield
        intermediate_size: 71680   # K=16 x I_e=4480; iso-param with the hybrids
        n_experts: 16
        top_k: 2
        hopfield_grad_scale: sqrt_consistent
        routing_norm: zscore
        temperature: 1.0
        repulsion_form: abs
        repulsion_coef: 0.1          # UNCHANGED: still output-space, just subsampled
        repulsion_space: output
        repulsion_subsample: 64      # ~1.2% of the step; weight-space measured ~12% worse
        cos_probe_interval: 100      # now possible under sparsity, and the only way to SEE
                                     # alignment in a sparse arm
        n_repulsion_pairs: 4
        gelu_grad_method: sigmoid
        # ---- corrected variant ----
        e_sign_override: "pos"
        sinkhorn_iters: 3
        sinkhorn_persist_mu: true
        sinkhorn_mu_iters: 12
        repulsion_tensor_idx: true
        # ---- sparsity ----
        renormalize_topk: true       # REQUIRED: deletes the all-K denominator, which is ~55% of
                                     # the softmax mass and is what no sparse path can estimate.
                                     # Free when TRAINED (44.54 vs 44.58); +0.483 bpb retrofitted.
        fused_experts: true
        sparse_forward: true
        sparse_candidates: 2         # = top_k: maximum speed. p=4 would buy recall we do not need
                                     # when training, since there is no dense reference to match.
        proxy_rank: 16
        proxy_kind: subspace
        proxy_out_dim: 512
        proxy_iters: 1               # per-iteration heads are eval-only
        proxy_loss_coef: 0.01        # online distillation; reached 0.82 agreement in a 3k probe
        activation_function: gelu
        add_bias: false


tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/boltzmann-moe/results/sparse90k/s90k_pure_T12_sparse
  save_interval: 1000
  max_to_keep: 95   # 90000/1000 = 90 ckpts; keep ALL so intermediate token counts stay evaluable

# NOTE 2026-09-14: the wandb name was wrong here. These configs were created by
# copying a parent config; only save_path was updated, so every derived arm logged to
# wandb under the PARENT's name and collided there. Local results under save_path were
# always correct (that is what the reported numbers come from), but the wandb view was
# missing or merged. wandb name must equal the config basename.
logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: energy-inference-large
    name: s90k_pure_T12_sparse

training_parameters:
  num_training_steps: 90000
  eval_interval: 5000
  micro_batch_size: 4          # 16384 tok/call -- REQUIRED for the speedup
  gradient_accumulation_steps: 2   # 8 GPUs x 4 x 2 x 4096 = 262144, matches dense
  eval_during_training: false
  gradient_clipping: 1

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 2e-3
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-8

lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000
  num_constant_steps: 0
  num_decay_steps: 88000

mixed_precision_args:
  dtype: bf16

distributed_args:
  fsdp_algorithm: 2
  torch_compile: true
  stage: 0
