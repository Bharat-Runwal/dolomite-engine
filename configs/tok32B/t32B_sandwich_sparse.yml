# ============================================================================================
# 32B-TOKEN SPARSE ARM -- SANDWICH 400M (GPT + energy x4 + GPT)
# Single job: DENSE until step 500 (teaches the proxy), SPARSE thereafter. See HANDOFF 12.22.
#
# TOKEN BUDGET IS THE POINT. 61035 steps x 524288 tok/step = 32.00B tokens, which is EXACTLY
# scale32B_boltz_sinkhorn's budget (61035 x 16x1x8x4096). Steps, tokens and the LR schedule all
# align, so the comparison against it is like-for-like on every axis.
# Matching STEPS alone at our old 262144 would have given 16.0B -- half -- and that is precisely
# the failure that made iclr_big_hop_pure_sink's -0.99pp delta unreadable (pre-flight check 2).
#
# WHY 61035 AND NOT 90000. 90k was inherited from the slope90k_* lineage, whose schedules were
# BROKEN (warmup 2000 + decay 28000 against num_training_steps 90000, so 60000 steps ran pinned at
# the 2e-4 floor and bought 0.015-0.019 nats -- HANDOFF 12.4). It was never a validated budget.
# 61035 is a budget a real, correctly-scheduled baseline actually ran.
#
# WHY sparse_start_step 500 AND NOT 0. Measured 2026-09-16: sw2k_sparse_c10x ran sparse from step 0
# with an untrained proxy and matched sw2k_dense to within 0.002 nats at steps 100-150, and the
# clean at-peak pair (sw2k_sparse vs sw2k_dense) put sparse only +0.009..+0.060 nats behind through
# step 1250. So a dense phase is NOT required -- because _forward_sparse computes EXACT energies for
# the p=4 candidates and re-ranks, the proxy only chooses WHICH 4 of 16 to consider and half of
# those come from a deterministic rotation, so a poor proxy costs candidate quality rather than
# selection correctness. 500 dense steps is 0.8% of the run and buys the head start for almost
# nothing, so it is kept as cheap insurance, not as a dependency.
#
# WALL CLOCK at 8 GPUs: dense mbs 1 measured 6.69-7.09 s/step at 65536 tok/GPU/step, and sparse is
# ~1.85x on this shape at mbs 1 (12.15), so ~3.6 s/step -> ~61 h ~= 2.5 DAYS. At 16 GPUs ~1.3 days.
# Sep 24 deadline with ~7 days left: comfortable at 8 GPUs, and WSD means an early stop is still
# harvestable via a branched decay (12.20).
#
# LAUNCH (8 GPUs, NOT 4):
#   bash experiments/boltzmann-moe/scripts/bsub/submit_selfresuming.sh \
#        t32B_sandwich_sparse configs/tok32B/t32B_sandwich_sparse.yml 8 24:00 128G
# ============================================================================================
datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path: /proj/dmfexp/nima/.cache/megatron
      data_path:
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
        - 0.5
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
      split: 99.5,0.5,0
      sequence_length: 4096

tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken

model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: energy
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations: [1, 4, 1]        # GPT x1, energy block x4, GPT x1
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 1024
    num_layers: 3
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: dual_unconstrained
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
      - &gattn
        sequence_mixer_type: softmax_attention
        num_attention_heads: 16
        num_key_value_heads: 16
        add_bias: false
        attention_multiplier: 0.125
      - sequence_mixer_type: energy_attention
        num_attention_heads: 16
        num_key_value_heads: 16
        add_bias: false
        attention_multiplier: 0.125
      - *gattn
    mlp_blocks:
      - &gffn
        mlp_type: MLP
        activation_function: swiglu
        intermediate_size: 4096
        add_bias: false
      - mlp_type: EnergyFF_BoltzmannMoE
        expert_kind: hopfield
        intermediate_size: 253952      # I_e = 253952 / 16 = 15872 -- 3.5x the pure T12's 4480,
                                       # which is why sparsity pays here even at mbs 1 (12.15)
        n_experts: 16
        top_k: 2
        hopfield_grad_scale: sqrt_consistent
        routing_norm: zscore
        temperature: 1.0
        repulsion_form: abs
        repulsion_coef: 2.0          # WEIGHT-space value (rep_wt2), NOT the output-space 0.1
        repulsion_space: weight      # output-space needs all K expert outputs, which the sparse
                                     # path never computes. 12.13 ranks the substitutes by the
                                     # output alignment they reach from scratch: weight-block
                                     # cosines 0.43-0.44, subsampled output estimator 0.53->0.74
                                     # (WORST -- unbiased in value, but high variance, and Adam
                                     # damps a high-variance term relative to its mean).
                                     # THIS IS THE EXPERIMENT 12.13 SAYS WAS NEVER RUN.
        cos_probe_interval: 100      # affordable under sparsity and the ONLY way to see expert
                                     # alignment in a sparse arm. Watch it: if it climbs toward
                                     # 0.7+ the diversity control has failed and 12.13 repeats.            # output-space; a sparse arm needs weight-space 2.0
        n_repulsion_pairs: 4
        gelu_grad_method: sigmoid
        # ---- corrected-sign variant ----
        e_sign_override: "pos"
        sinkhorn_iters: 3
        sinkhorn_persist_mu: true      # ADDED vs parent -- see deviation (a) in the header
        sinkhorn_mu_iters: 4           # == layer_iterations[1]. Parent had 1 against a 4x block.
        repulsion_tensor_idx: true
        # ---- SPARSITY (HANDOFF 12.9-12.13) ----
        renormalize_topk: true       # MANDATORY, not a tuning knob. With it FALSE, top-2 of 16
                                     # carries only ~55% of the softmax mass and top-k is a
                                     # SCALING rather than a sparsification (12.12). No sparse
                                     # path can estimate the all-K denominator; this deletes it.
                                     # Free when TRAINED (44.54 vs 44.58); +0.483 bpb retrofitted.
        fused_experts: true
        sparse_start_step: 500       # <<< DENSE until step 500, SPARSE from 500 on, IN ONE JOB.
                                     # Steps 1-499 take _forward_fused, whose _proxy_step distils
                                     # the proxy against the EXACT all-K routing distribution --
                                     # the only regime in which it learns the ranking (reference:
                                     # 0.1193 -> 0.7906 in 280 dense steps). From 500 the sparse
                                     # path MAINTAINS it as the routing target drifts.
                                     # Costs ONE torch.compile recompile at step 500; the flag is
                                     # a Python bool derived from global_step, so every rank flips
                                     # on the same step with no communication.
        sparse_forward: true         # skips BOTH projections for unselected experts. EXACT given
                                     # the selection (4e-16), and sparse_candidates=K reproduces
                                     # dense bit-for-bit on a real checkpoint.
        sparse_candidates: 2         # the proxy proposes 2...
        sparse_explore: 2            # ...plus a deterministic rotation of 2 more, TRAINING ONLY.
                                     # Without it the proxy is never trained in the sparse path
                                     # (proxy_loss_coef is a no-op) and the arm trains with a FIXED
                                     # RANDOM router -- that happened once and went unnoticed
                                     # because no metric logged. Costs speed: p=4's ceiling is
                                     # ~4.3x, not 6.2x. Inference uses top-2, no exploration.
        proxy_rank: 16
        proxy_kind: subspace         # "quad" FAILS (0.348 vs 0.125 chance)
        proxy_out_dim: 512
        proxy_iters: 1               # per-iteration heads are EVAL-ONLY: the call counter and
                                     # activation checkpointing are incompatible.
        proxy_loss_coef: 0.01        # online distillation against the exact energies that
                                     # exploration makes available
        activation_function: gelu
        add_bias: false
      - *gffn

tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/boltzmann-moe/results/tok32B/t32B_sandwich_sparse
  save_interval: 200
  max_to_keep: 2

logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: energy-inference-large
    name: t32B_sandwich_sparse

training_parameters:
  num_training_steps: 61035            # x 524288 tok = 32.00B tokens -- IDENTICAL to scale32B
  eval_interval: 5000
  micro_batch_size: 1                  # ONE micro_batch_size for BOTH phases, which is what makes
                                       # a single job possible: mbs is a dataloader parameter, not a
                                       # model attribute, so it cannot be flipped mid-run the way
                                       # sparse_forward can. Dense needs mbs 1 (mbs 4 dense is
                                       # 8.75 GiB and OOMs), so mbs 1 it is.
                                       # COST: 4096 tok/call instead of 16384, so less than the peak
                                       # sparse speedup. Acceptable HERE because both 400M shapes have
                                       # wide experts (I_e 15872-17920) and 12.15 measured the sandwich
                                       # at 1.83-1.91x even at mbs 1. Do NOT copy this to a hybrid
                                       # shape with small I_e, where 4096 tok/call LOSES (0.41-0.49x).
  gradient_accumulation_steps: 16       # 8 GPU x 1 x 16 x 4096 = 524288 tok/step -- IDENTICAL to
                                       # scale32B (16 x 1 x 8), so steps AND tokens both match and
                                       # the LR schedules line up point-for-point.
                                       # NOTE 8 GPUs here, not 4: at 4 GPUs this is 262144 and the
                                       # run silently trains on HALF the tokens. That exact error
                                       # made iclr_big_hop_pure_sink's -0.99pp unreadable.
  eval_during_training: false
  gradient_clipping: 1

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 2e-3                           # NOT lowered -- 12.17 refutes "2e-3 was too high"
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1.0e-8

# ---- THE WSD SCHEDULE ----------------------------------------------------------------------
#   warmup   1000  ( 1.1%)  linear 0 -> 2e-3
#   stable  80000  (88.9%)  HELD at 2e-3   <-- displayed loss looks WORSE here; that is the
#                                              temperature penalty, not slower learning
#   decay    9000  (10.0%)  cosine 2e-3 -> 2e-4
# CosineScheduler implements exactly this once num_constant_steps > 0 (scheduler.py:90-106):
# warmup -> factor 1.0 -> cosine to lr_decay_factor. No code change.
lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000               # matches scale32B, so the two align step-for-step
  num_constant_steps: 53000            # 86.8% HELD AT PEAK
  num_decay_steps: 6035                # 9.9%; 2000+53000+6035 = 61035  <- PRE-FLIGHT 1

mixed_precision_args:
  dtype: bf16

distributed_args:
  fsdp_algorithm: 2
  gradient_checkpointing_method: block
  torch_compile: true
  stage: 0
