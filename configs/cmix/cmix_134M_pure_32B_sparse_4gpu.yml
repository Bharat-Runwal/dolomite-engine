# cmix_134M_pure_32B_sparse_4gpu -- FALLBACK. IDENTICAL to cmix_134M_pure_32B_sparse except ga doubled.
# *** INTENDED GPU COUNT: 4 ***   4 x mbs 4 x ga 4 x 4096 = 262,144 tok/step, unchanged.
# Same save_path as the 8-GPU arm, so switching to this config RESUMES rather than restarts.
# OOM FIX (2026-09-17): micro_batch_size 4 -> 2, ga 4 -> 8.
# tokens/step is UNCHANGED at 262,144 (4 GPU x mbs 2 x ga 8 x 4096), so effective batch,
# LR schedule and the 32.0B total are identical -- only per-GPU activation memory halves.
# WHY THIS ARM AND NOT ITS SIBLINGS: pure is layer_iterations [12] -- ONE block iterated
# 12x, against hybrid's 6 and sandwich's 4 -- so it holds ~2-3x their activation memory at
# equal mbs. It OOMed before step 1 (tried 2.19 GiB with 1.97 GiB free, 77.2 GiB in use)
# while every other arm ran fine.

datasets:
- class_name: MegatronDataset
  data_name: Megatron
  data_sampling_ratio: 1
  class_args:
    eval_steps: 2
    data_cache_path: /proj/dmfexp/nima/.cache/megatron_cmix
    data_path:
    - 0.35
    - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
    - 0.35
    - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
    - 0.15
    - /proj/datasets/granite-4-datasets-megatron-merged/megamath-web-pro_0
    - 0.15
    - /proj/datasets/granite-4-datasets-megatron-merged/finemath-3plus-rewritten_0
    split: 99,0.5,0.5
    sequence_length: 4096
tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken
model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: energy
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations:
    - 12
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 768
    num_layers: 1
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: psd_anti
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
    - sequence_mixer_type: energy_attention
      num_attention_heads: 12
      num_key_value_heads: 12
      add_bias: false
      attention_multiplier: 0.125
    mlp_blocks:
    - mlp_type: EnergyFF_BoltzmannMoE
      expert_kind: hopfield
      intermediate_size: 71680
      n_experts: 16
      top_k: 2
      hopfield_grad_scale: sqrt_consistent
      routing_norm: zscore
      temperature: 1.0
      repulsion_form: abs
      repulsion_coef: 0.1
      n_repulsion_pairs: 4
      gelu_grad_method: sigmoid
      e_sign_override: pos
      sinkhorn_iters: 3
      repulsion_tensor_idx: true
      activation_function: gelu
      add_bias: false
      sparse_forward: true
      sparse_candidates: 2
      sparse_explore: 2
      sparse_start_step: 300
      renormalize_topk: true
      fused_experts: true
      proxy_rank: 16
      proxy_kind: subspace
      proxy_out_dim: 512
      proxy_iters: 1
      proxy_loss_coef: 0.01
      proxy_init: svd
      repulsion_space: output
      repulsion_subsample: 64
      cos_probe_interval: 100
      sinkhorn_mu_iters: 12
tuning_args:
  tuning_method: pretraining
save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/boltzmann-moe/results/cmix32B/cmix_134M_pure_32B_sparse
  save_interval: 2000
  max_to_keep: 2
logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: energy-inference-large
    name: cmix_134M_pure_32B_sparse
training_parameters:
  num_training_steps: 122070
  eval_interval: 5000
  micro_batch_size: 2
  gradient_accumulation_steps: 8
  eval_during_training: false
  gradient_clipping: 1
optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 2e-3
    weight_decay: 0.1
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000
  num_constant_steps: 0
  num_decay_steps: 120070
mixed_precision_args:
  dtype: bf16
distributed_args:
  fsdp_algorithm: 2
  torch_compile: true
  stage: 0
