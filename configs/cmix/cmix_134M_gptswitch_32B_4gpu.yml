# cmix_134M_gptswitch_32B_4gpu -- FALLBACK CONFIG. IDENTICAL to cmix_134M_gptswitch_32B EXCEPT
# gradient_accumulation_steps 2 -> 4.
#
# *** INTENDED GPU COUNT: 4 ***  (the sibling cmix_134M_gptswitch_32B.yml is for 8)
# World size is NOT in a config, so this is the only place it is written down. Launch with
#   bash experiments/boltzmann-moe/scripts/bsub/submit_train.sh cmix_134M_gptswitch_32B_4gpu configs/cmix/cmix_134M_gptswitch_32B_4gpu.yml 4 preemptable ...
# and confirm the launch ledger row reads tokens_per_step=262144.
#
# WHY ga AND NOT steps: 4 GPU x mbs 4 x ga 4 x 4096 = 262,144 tok/step, the SAME as
# 8 GPU x mbs 4 x ga 2 x 4096. num_training_steps stays 122070, so the
# effective batch, the LR schedule and the 32.00B total are byte-identical to the 8-GPU arm --
# only wall-clock doubles. Doubling num_training_steps instead would HALVE tokens/step and
# change the batch size and schedule shape, making the arm non-comparable.
#
# save_path and the wandb name are UNCHANGED on purpose: switching to this config RESUMES
# the 8-GPU run from its last checkpoint instead of starting a divergent second copy.
datasets:
- class_name: MegatronDataset
  data_name: Megatron
  data_sampling_ratio: 1
  class_args:
    eval_steps: 2
    data_cache_path: /proj/dmfexp/nima/.cache/megatron_cmix
    data_path:
    - 0.35
    - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
    - 0.35
    - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
    - 0.15
    - /proj/datasets/granite-4-datasets-megatron-merged/megamath-web-pro_0
    - 0.15
    - /proj/datasets/granite-4-datasets-megatron-merged/finemath-3plus-rewritten_0
    split: 99,0.5,0.5
    sequence_length: 4096
tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken
model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: energy
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations:
    - 1
    - 1
    - 1
    - 1
    - 1
    - 1
    - 1
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 768
    num_layers: 7
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: psd_anti
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
    - &id001
      sequence_mixer_type: softmax_attention
      num_attention_heads: 12
      num_key_value_heads: 12
      add_bias: false
      attention_multiplier: 0.125
    - *id001
    - *id001
    - *id001
    - *id001
    - *id001
    - *id001
    mlp_blocks:
    - &id002
      mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 2048
      add_bias: false
    - *id002
    - *id002
    - *id002
    - *id002
    - *id002
    - mlp_type: MoE
      activation_function: swiglu
      intermediate_size: 341
      num_experts: 16
      num_experts_per_tok: 2
      normalized_topk: true
      add_bias: false
tuning_args:
  tuning_method: pretraining
save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/boltzmann-moe/results/cmix32B/cmix_134M_gptswitch_32B
  save_interval: 2000
  max_to_keep: 2
logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: energy-inference-large
    name: cmix_134M_gptswitch_32B
training_parameters:
  num_training_steps: 122070
  eval_interval: 5000
  micro_batch_size: 4
  gradient_accumulation_steps: 4
  eval_during_training: false
  gradient_clipping: 1
optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 2e-3
    weight_decay: 0.1
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000
  num_constant_steps: 0
  num_decay_steps: 120070
mixed_precision_args:
  dtype: bf16
distributed_args:
  fsdp_algorithm: 2
  torch_compile: false
  stage: 0
