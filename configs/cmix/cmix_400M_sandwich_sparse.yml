# cmix_400M_sandwich_sparse -- IDENTICAL to t32B_sandwich_sparse.yml EXCEPT the datamix (70/30 web/math,
# from the colleagues' s8e4_stdmoe_fh2_boltz_topk2.yml). Architecture, recurrence,
# hopfield experts, Sinkhorn, sparsity and schedule are UNCHANGED, so this is a
# clean datamix-controlled A/B against t32B_sandwich_sparse.
# ============================================================================================
# 32B-TOKEN SPARSE ARM -- SANDWICH 400M (GPT + energy x4 + GPT)
# Single job: DENSE until step 500 (teaches the proxy), SPARSE thereafter. See HANDOFF 12.22.
#
# TOKEN BUDGET IS THE POINT. 61035 steps x 524288 tok/step = 32.00B tokens, which is EXACTLY
# scale32B_boltz_sinkhorn's budget (61035 x 16x1x8x4096). Steps, tokens and the LR schedule all
# align, so the comparison against it is like-for-like on every axis.
# Matching STEPS alone at our old 262144 would have given 16.0B -- half -- and that is precisely
# the failure that made iclr_big_hop_pure_sink's -0.99pp delta unreadable (pre-flight check 2).
#
# WHY 61035 AND NOT 90000. 90k was inherited from the slope90k_* lineage, whose schedules were
# BROKEN (warmup 2000 + decay 28000 against num_training_steps 90000, so 60000 steps ran pinned at
# the 2e-4 floor and bought 0.015-0.019 nats -- HANDOFF 12.4). It was never a validated budget.
# 61035 is a budget a real, correctly-scheduled baseline actually ran.
#
# WHY sparse_start_step 500 AND NOT 0. Measured 2026-09-16: sw2k_sparse_c10x ran sparse from step 0
# with an untrained proxy and matched sw2k_dense to within 0.002 nats at steps 100-150, and the
# clean at-peak pair (sw2k_sparse vs sw2k_dense) put sparse only +0.009..+0.060 nats behind through
# step 1250. So a dense phase is NOT required -- because _forward_sparse computes EXACT energies for
# the p=4 candidates and re-ranks, the proxy only chooses WHICH 4 of 16 to consider and half of
# those come from a deterministic rotation, so a poor proxy costs candidate quality rather than
# selection correctness. 500 dense steps is 0.8% of the run and buys the head start for almost
# nothing, so it is kept as cheap insurance, not as a dependency.
#
# WALL CLOCK at 8 GPUs: dense mbs 1 measured 6.69-7.09 s/step at 65536 tok/GPU/step, and sparse is
# ~1.85x on this shape at mbs 1 (12.15), so ~3.6 s/step -> ~61 h ~= 2.5 DAYS. At 16 GPUs ~1.3 days.
# Sep 24 deadline with ~7 days left: comfortable at 8 GPUs, and WSD means an early stop is still
# harvestable via a branched decay (12.20).
#
# LAUNCH (8 GPUs, NOT 4):
#   bash experiments/boltzmann-moe/scripts/bsub/submit_selfresuming.sh \
#        cmix_400M_sandwich_sparse configs/tok32B/cmix_400M_sandwich_sparse.yml 8 24:00 128G
# ============================================================================================
# ---- THE WSD SCHEDULE ----------------------------------------------------------------------
#   warmup   1000  ( 1.1%)  linear 0 -> 2e-3
#   stable  80000  (88.9%)  HELD at 2e-3   <-- displayed loss looks WORSE here; that is the
#                                              temperature penalty, not slower learning
#   decay    9000  (10.0%)  cosine 2e-3 -> 2e-4
# CosineScheduler implements exactly this once num_constant_steps > 0 (scheduler.py:90-106):
# warmup -> factor 1.0 -> cosine to lr_decay_factor. No code change.
# proxy_init: svd -- refit the proxy from the rank-r SVD of each expert weight at the
# dense->sparse switch. MEASURED on a trained 1B ckpt: top-2 agreement with the exact
# energies 0.0893 (distilled) vs 0.5541 (SVD) vs 0.0378 (random). Distillation continues
# after the refit; SVD is a warm start, not a replacement.
# repulsion_space 'weight'/coef 2.0 -> 'output'/0.1 + subsample 64 (2026-09-17). TWO reasons:
#  1. CONSISTENCY: its paper sibling cmix_400M_hybrid_sparse uses output/0.1. A pair that
#     differs in repulsion space is not a controlled comparison.
#  2. MULTI-NODE: weight-space regroups a dim-0-sharded DTensor by expert and WEDGES on >1
#     node (silent hang, 0 NCCL errors). output-space is the only validated multi-node choice,
#     and this arm now runs as 2 nodes x 4 GPUs.
# proxy_init: svd also set -- this is a fresh run so the refit will fire at the switch.
# K 16 -> 32 (2026-09-17), ISO-PARAM: I_total stays 253,952, so I_e halves to 7,936
# and total params are unchanged at 401M. p stays 4 (top-2 + 2 explore), so
# p/K falls 0.250 -> 0.125 and the sparse CEILING doubles 4.0x -> 8.0x.
# Rationale: (a) doubles the achievable saving at no parameter cost; (b) I_e=7,936 is
# still inside the proven 4480-15872 band; (c) our best historical arm was K=32/top-2
# (iclr_hop_K32_top2_sink, Avg11 44.58, against 40.96 for a K=16 pure); (d) it gives the
# paper a K axis that varies while recurrence is held, which the K=16/K=64 set could not.
# Switched at step ~500 of 61035 (0.8%), so the restart cost ~5 minutes.

datasets:
- class_name: MegatronDataset
  data_name: Megatron
  data_sampling_ratio: 1
  class_args:
    eval_steps: 2
    data_cache_path: /proj/dmfexp/nima/.cache/megatron_cmix
    data_path:
    - 0.35
    - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
    - 0.35
    - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
    - 0.15
    - /proj/datasets/granite-4-datasets-megatron-merged/megamath-web-pro_0
    - 0.15
    - /proj/datasets/granite-4-datasets-megatron-merged/finemath-3plus-rewritten_0
    split: 99,0.5,0.5
    sequence_length: 4096
tokenizer_args:
  tokenizer_name: /proj/datasets/tokenizers/granite-4.0-tiktoken
model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: energy
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations:
    - 1
    - 4
    - 1
    initializer_range: 0.02
    layer_norm_epsilon: 1.0e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 1024
    num_layers: 3
    init_method: normal
    tie_word_embeddings: true
    energy_proj_type: psd_anti
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096
    sequence_mixer_blocks:
    - &id001
      sequence_mixer_type: softmax_attention
      num_attention_heads: 16
      num_key_value_heads: 16
      add_bias: false
      attention_multiplier: 0.125
    - sequence_mixer_type: energy_attention
      num_attention_heads: 16
      num_key_value_heads: 16
      add_bias: false
      attention_multiplier: 0.125
    - *id001
    mlp_blocks:
    - &id002
      mlp_type: MLP
      activation_function: swiglu
      intermediate_size: 4096
      add_bias: false
    - mlp_type: EnergyFF_BoltzmannMoE
      expert_kind: hopfield
      intermediate_size: 253952
      n_experts: 32
      top_k: 2
      hopfield_grad_scale: sqrt_consistent
      routing_norm: zscore
      temperature: 1.0
      repulsion_form: abs
      repulsion_coef: 0.1
      repulsion_space: output
      cos_probe_interval: 100
      n_repulsion_pairs: 4
      gelu_grad_method: sigmoid
      e_sign_override: pos
      sinkhorn_iters: 3
      sinkhorn_persist_mu: true
      sinkhorn_mu_iters: 4
      repulsion_tensor_idx: true
      renormalize_topk: true
      fused_experts: true
      sparse_start_step: 300
      sparse_forward: true
      sparse_candidates: 2
      sparse_explore: 2
      proxy_rank: 16
      proxy_kind: subspace
      proxy_out_dim: 512
      proxy_iters: 1
      proxy_loss_coef: 0.01
      activation_function: gelu
      add_bias: false
      proxy_init: svd
      repulsion_subsample: 64
    - *id002
tuning_args:
  tuning_method: pretraining
save_args:
  save_path: /proj/dmfexp/nima/Code/dolomite-engine/experiments/boltzmann-moe/results/tok32B/cmix_400M_sandwich_sparse
  save_interval: 200
  max_to_keep: 2
logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: energy-inference-large
    name: cmix_400M_sandwich_sparse
training_parameters:
  num_training_steps: 61035
  eval_interval: 5000
  micro_batch_size: 1
  gradient_accumulation_steps: 16
  eval_during_training: false
  gradient_clipping: 1
optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 2e-3
    weight_decay: 0.1
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000
  num_constant_steps: 53000
  num_decay_steps: 6035
mixed_precision_args:
  dtype: bf16
distributed_args:
  fsdp_algorithm: 2
  gradient_checkpointing_method: block
  torch_compile: true
  stage: 0
