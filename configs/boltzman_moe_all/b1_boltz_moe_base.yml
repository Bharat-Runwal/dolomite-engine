# Base config for the 9-variant 400M-active sweep (h1-style hybrids + GPT baselines).
#
# Architecture variants (all d=1024, 16 heads × 64 head_dim):
# FH1 (TopK_Energy_MoE_MLP, 8 experts top-2) on energy layers:
#     s8e1_fh1_6iter    8 softmax + 1 energy ×6 iters,   fk ipe=51008  (1027M / 400M)
#     s8e2_fh1_3iter    8 softmax + 2 energy ×3 iters,   fk ipe=24960  (1013M / 400M)
#     s8e4_fh1_2iter    8 softmax + 4 energy ×2 iters,   fk ipe=11968  ( 988M / 400M)
#   EM (no MoE, dense Energy_MLP) on energy layers:
#     s8e1_em_6iter    8 softmax + 1 energy ×6 iters,   em ipe=102080 (400M / 400M)
#     s8e2_em_3iter    8 softmax + 2 energy ×3 iters,   em ipe=49984  (400M / 400M)
#     s8e4_em_2iter    8 softmax + 4 energy ×2 iters,   em ipe=23936  (400M / 400M)
#   Pure GPT baselines (softmax_attention + dense MLP only):
#     s9_gpt           9 softmax layers,  ipe=9344 (399M / 399M)
#     s10_gpt          10 softmax layers, ipe=8256 (398M / 398M)
#     s12_gpt          12 softmax layers, ipe=6656 (398M / 398M)
#
# Sweep script patches sequence_mixer_blocks, mlp_blocks, layer_iterations, num_layers.
# Default below = s8e4_fh1_2iter (TopK MoE in 4 energy layers ×2 iters each).

datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      data_cache_path: /proj/dmfexp/energy-gpt/cache-bsaha
      data_path:
        - 0.35
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_0
        - 0.35
        - /proj/datasets/granite-4-datasets-megatron-merged/web-nemotron-cc-hq-p2_1
        - 0.15
        - /proj/datasets/granite-4-datasets-megatron-merged/megamath-web-pro_0
        - 0.15
        - /proj/datasets/granite-4-datasets-megatron-merged/finemath-3plus-rewritten_0
      split: 99,0.5,0.5
      sequence_length: 4096

tokenizer_args:
  tokenizer_name: /proj/dmfexp/energy-gpt/data/granite-4.0-tiktoken

model_args:
  model_class: AutoModelForCausalLM
  pretrained_config:
    model_type: energy
    initializer_range: 0.02
    layer_norm_epsilon: 1e-05
    normalization_function: rmsnorm
    position_embedding_type: rope
    rope_dim: 64
    hidden_size: 1024
    num_layers: 12
    num_iterations: 1
    num_pre_layers: 0
    num_post_layers: 0
    layer_iterations: [1, 1, 1, 1, 1, 1, 1, 1, 2, 2, 2, 2]
    init_method: normal
    tie_word_embeddings: true
    proj_mode: unconstrained

    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100256
    vocab_size: 100352
    max_position_embeddings: 4096

    sequence_mixer_blocks:
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 16, num_key_value_heads: 16, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 16, num_key_value_heads: 16, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 16, num_key_value_heads: 16, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 16, num_key_value_heads: 16, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 16, num_key_value_heads: 16, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 16, num_key_value_heads: 16, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 16, num_key_value_heads: 16, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: softmax_attention, num_attention_heads: 16, num_key_value_heads: 16, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: energy_attention, num_attention_heads: 16, num_key_value_heads: 16, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: energy_attention, num_attention_heads: 16, num_key_value_heads: 16, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: energy_attention, num_attention_heads: 16, num_key_value_heads: 16, add_bias: false, attention_multiplier: 0.125}
      - {sequence_mixer_type: energy_attention, num_attention_heads: 16, num_key_value_heads: 16, add_bias: false, attention_multiplier: 0.125}

    mlp_blocks:
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
      - {mlp_type: MLP, activation_function: swiglu, intermediate_size: 2048, add_bias: false}
      - {mlp_type: TopK_Energy_MoE_MLP, intermediate_size: 11968, n_experts: 8, top_k: 2, load_balance_coef: 0.01, dropout: 0.0, add_bias: false}
      - {mlp_type: TopK_Energy_MoE_MLP, intermediate_size: 11968, n_experts: 8, top_k: 2, load_balance_coef: 0.01, dropout: 0.0, add_bias: false}
      - {mlp_type: TopK_Energy_MoE_MLP, intermediate_size: 11968, n_experts: 8, top_k: 2, load_balance_coef: 0.01, dropout: 0.0, add_bias: false}
      - {mlp_type: TopK_Energy_MoE_MLP, intermediate_size: 11968, n_experts: 8, top_k: 2, load_balance_coef: 0.01, dropout: 0.0, add_bias: false}

tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /proj/dmfexp/energy-gpt/checkpoints-bsaha/boltzmann_sweep/s8e4_fh1_2iter
  save_interval: 2000

logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: dolomite
    name: boltzmann_sweep_base

training_parameters:
  num_training_steps: 30000
  eval_interval: 2000
  micro_batch_size: 2
  gradient_accumulation_steps: 4
  eval_during_training: false
  gradient_clipping: 1

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 2e-3
    weight_decay: 0.1
    betas:
      - 0.9
      - 0.95
    eps: 1e-8

lr_scheduler_args:
  lr_decay_style: cosine
  lr_decay_factor: 0.1
  num_warmup_steps: 2000
  num_constant_steps: 0
  num_decay_steps: 28000

mixed_precision_args:
  dtype: bf16

distributed_args:
  fsdp_algorithm: 2
  torch_compile: true
  stage: 0
